{
  "schema_version": 1,
  "id": "youtube.youtube_audio",
  "name": "YouTube Audio",
  "kind": "built_in",
  "version": "0.1.0",
  "short_description": "Download a YouTube video's audio (MP3) or video (MP4) \u2014 by search query or direct URL.",
  "description": "Wraps yt-dlp to fetch a YouTube result by free-text search (top hit) or direct URL, in either audio-extraction mode (MP3) or raw-video mode (MP4). Useful for sourcing background tracks for composites OR for ingesting video files into dataset pipelines.",
  "keywords": [
    "youtube",
    "audio",
    "video",
    "download",
    "yt-dlp",
    "mp3",
    "mp4",
    "music",
    "search"
  ],
  "inputs": [
    {
      "name": "query",
      "type": "string",
      "required": false,
      "description": "Free-text YouTube search query (top hit is used), or a direct http(s) YouTube URL."
    },
    {
      "name": "mode",
      "type": "string",
      "required": false,
      "description": "'audio' (default \u2014 extract to MP3) or 'video' (download MP4 without audio extraction)."
    }
  ],
  "outputs": [
    {
      "name": "media",
      "type": "file",
      "placeholder": "output",
      "description": "Downloaded media file: MP3 in audio mode or MP4 in video mode.",
      "mode": "create_or_replace"
    }
  ],
  "graph": {
    "consumes": [],
    "depends_on": [],
    "provides": [
      "media"
    ]
  },
  "isolation": {
    "mode": "subprocess",
    "network": true,
    "binaries": [
      "yt-dlp",
      "ffmpeg"
    ],
    "requirements": []
  },
  "cache": {
    "mode": "none"
  },
  "conditions": [
    {
      "kind": "requires_input",
      "input": "query"
    }
  ],
  "command": {
    "argv": [
      "{python_exec}",
      "-m",
      "astrid.packs.youtube.executors.youtube_audio.run",
      "--query",
      "{query}",
      "--mode",
      "{mode}",
      "--out",
      "{output}"
    ]
  },
  "metadata": {
    "runtime_module": "astrid.packs.youtube.executors.youtube_audio.run",
    "runtime_file": "run.py"
  }
}
