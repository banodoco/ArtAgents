[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "banodoco-social"
version = "0.1.0"
description = "Shared Banodoco social publishing tools."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Banodoco" }
]
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8"
]

[project.scripts]
banodoco-social = "banodoco_social.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["banodoco_social*"]
