[pytest]
# Scope collection to Astrid's own tests, and exclude vendored upstream
# test trees (e.g. the `ostris/ai-toolkit` git submodule at
# `astrid/packs/seinfeld/ai_toolkit/upstream`). Those tests target the
# upstream project, require heavy deps like `torch`, and are not part of
# Astrid's own test suite.
testpaths =
    tests
    scripts/migrations
norecursedirs =
    astrid/packs/seinfeld/ai_toolkit/upstream
    astrid/packs/*/ai_toolkit/upstream
    .claude
    .git
    .venv
    node_modules
markers =
    slow: slower integration-style tests that should remain opt-in for tight loops
    performance_smoke: lightweight performance smoke tests with loose CI-safe thresholds
    renderer_parity: optional renderer parity integration against committed sprint-08 fixtures
    timeout: per-test timeout marker used when pytest-timeout is installed
    standalone: tests intended to run independently from the default suite
    hype_cut_invariants: standalone hype cut invariant coverage
