schema_version: 1
id: rendering
name: Trusted Rendering Fixture
version: 1.0.0
permissions:
  - id: project_files
    reason: Read fixture project files.
  - id: subprocess
    reason: Run the fixture backend command.
aliases:
  - kind: renderer
    alias: rendering.legacy
    canonical_id: rendering.compat
  - kind: renderer
    alias: rendering.compat
    canonical_id: rendering.remotion
  - kind: renderer
    alias: rendering.missing
    canonical_id: rendering.absent
extensions:
  rendering:
    renderers:
      - manifests/remotion.renderer.yaml
      - manifests/ffmpeg.renderer.yaml
    planners:
      - manifests/hybrid.planner.yaml
    finalizers:
      - manifests/ffmpeg.finalizer.yaml
