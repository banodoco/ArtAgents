schema_version: 2
id: combined
name: Combined Pack
version: 1.0.0
description: Capability and database contribution.
capabilities: [references]
content:
  executors: executors
extensions:
  generation:
    features:
      - id: references
        label: References
agent:
  purpose: Manage references.
  required_context: [context.md]
documentation:
  kind: skill
  path: skill/SKILL.md
database:
  default_enabled: false
  depends_on:
    - pack: database_only
      min_migration: 1
  migrations:
    - version: 1
      name: initial
      path: migrations/0001_initial.sql
      tables: [combined_records]
  stream_types: [references.reference]
  event_kinds: [references.created]
  command_kinds: [references.create]
  repositories: [ReferenceRepository]
  conformance: [replay]
  cli_mounts:
    references: references
  bridge_mounts: [references]
