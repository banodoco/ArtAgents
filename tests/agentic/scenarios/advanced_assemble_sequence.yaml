name: advanced_assemble_sequence
tier: advanced
description: |
  The dominant real-creator loop: assemble several separately-produced clips
  into one sequence. The agent synthesizes four placeholder clips + an audio
  bed, then composes them via the canonical timeline verbs — register each as a
  pool asset, add four clips IN ORDER, set a crossfade between each adjacent
  pair (three transitions, not four), and bind the music. Probes fan-out (the
  same verb applied N times), ordering, and the N-1 off-by-one on transitions —
  composition the single-verb timeline tests never exercise together.

brief: advanced_assemble_sequence.md

priming:
  - create_project: $SLUG

agents:
  - model: deepseek-v4-pro
    count: 1
    subagent_type: general-purpose

acceptance:
  - no_aborts
  - events_contain: clip.added
  - events_contain: transition.set
  - events_contain: audio.bound
  - no_cross_project_binding
  - subjective:
      - assembled_clips_in_order
      - transitions_between_each_clip
      - bound_audio_track
      - used_canonical_timeline_verbs

budget:
  max_tokens_per_agent: 32768
  max_wall_clock_min: 15

tags:
  - advanced
  - composition
  - timeline
  - fan_out

assessment:
  universal_checks: true
  enforced:
    - id: assembled_clips_in_order
      question: |
        Did the agent add all four clips to the timeline as `clip.added` events,
        in the order the brief gave them (clips reference assets directly via
        `--asset`)?
      evidence: [events, stderr]
      grading: pass_fail
      weight: 2
      failure_mode: |
        Fewer than four `clip.added` events, or clips added out of order.
    - id: transitions_between_each_clip
      question: |
        Did the agent set a transition between each ADJACENT pair — three
        `transition.set` events for four clips (N-1), not four or zero?
      evidence: [events]
      grading: pass_fail
      weight: 2
      failure_mode: |
        Zero `transition.set` events, or an off-by-one (four/two) showing the
        agent didn't reason about N-1 boundaries.
    - id: bound_audio_track
      question: |
        Did the agent bind the music track to the timeline (an `audio.bound`
        event)?
      evidence: [events]
      grading: pass_fail
      weight: 1
      failure_mode: |
        No `audio.bound` event — the agent assembled video but never bound the
        requested music.
  graded:
    - id: used_canonical_timeline_verbs
      question: |
        Did the agent build the sequence via `astrid timelines ...` verbs rather
        than hand-editing the event log or invoking `python -m astrid.packs.*`?
      evidence: [stderr]
      grading: pass_fail
      weight: 2
      failure_mode: |
        Stderr shows direct event-log edits or `python -m astrid.packs.*`.
    - id: verified_the_assembly
      question: |
        Did the agent verify the result with a read-only command
        (`timelines preview` / `show` / `history`) and report the final clip
        order?
      evidence: [stderr, report]
      grading: pass_fail_partial
      weight: 1
      failure_mode: |
        No read-only verification; the agent assumed success without checking.
    - id: report_shape_intact
      question: |
        Does the report contain each numbered section the brief asked for, each
        non-empty?
      evidence: [report]
      grading: pass_fail
      weight: 1
  observed:
    - id: shell_calls_count
      question: "How many shell calls did the agent make? (integer, metadata only)"
      evidence: [stderr]
      grading: numeric
      weight: 0
    - id: clip_added_count
      question: "How many clip.added events are in the log? (integer, metadata only)"
      evidence: [events]
      grading: numeric
      weight: 0
