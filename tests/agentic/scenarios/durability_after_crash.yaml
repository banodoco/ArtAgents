name: durability_after_crash
tier: forensics
description: |
  Structural M4 scenario verifying head-vs-jsonl desync detection after
  a simulated crash.  The fixture writes a deliberate mismatch between
  assembly.head.json and assembly.jsonl under m4/desync/, outside normal
  timelines.  The deterministic check confirms that the detection
  mechanism flags the mismatch without serving stale state.
mode: structural

brief: durability_after_crash.md

priming:
  - create_project: ${SLUG}

agents:
  - model: ""
    dispatcher: fake
    count: 1

budget:
  max_tokens_per_agent: 0
  max_wall_clock_min: 1

tags:
  - m4
  - durability
  - desync
  - crash
  - structural

extras:
  m4_fixture:
    name: durability_after_crash
  m4_checks:
    durability_after_crash:
      enabled: true

assessment:
  universal_checks: false
  enforced: []
  graded: []
  observed: []
