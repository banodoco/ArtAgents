# Scenario schema for tests/agentic.
#
# This is documentation, not a runnable scenario. Every YAML under scenarios/
# (except files starting with _) must conform to the keys below. The auditor
# refuses to run a scenario that fails schema validation.

# REQUIRED
name: snake_case_identifier              # also the file name (without .yaml)
tier: core | discovery | authoring | recovery | forensics | meta
description: |
  One paragraph stating the agent-facing failure mode this scenario probes.
  This goes into the report so future maintainers understand intent.

# REQUIRED — what the agent's brief tells them
brief: brief_filename.md                 # in tests/agentic/briefs/
# Variables auto-substituted into the brief at run-time:
#   ${SLUG}        — the project slug (unique per agent run)
#   ${AGENT_ID}    — the agent identity (e.g. ds-probe-v9-cold-1)
#   ${RUN_TAG}     — the run tag for this batch
#   ${TARGET_ORCH} — if `target_orchestrator` is set below

# OPTIONAL — pre-staging done before the agent runs
priming:
  - create_project: ${SLUG}              # always do this implicitly; included for clarity
  - start: builtin.agent_probe           # start a specific orchestrator
  - ack:                                 # ack these steps as a "primer" actor
      - baseline_write
      - summarize
  # Add more priming verbs as needed:
  #   - touch: <file-path>               # touch a file mtime
  #   - write: { path: ..., content: ... }
  #   - start_with_plan:                 # start from an inline compiled plan
  #       id: builtin.synthetic
  #       plan: { plan_id: builtin.synthetic, version: 2, steps: [...] }
  #   - env: { KEY: value }

# OPTIONAL — declare an orchestrator this scenario expects the agent to use
target_orchestrator: video_editing.hype        # surfaces in `tool_used` criterion

# REQUIRED — at least one agent
agents:
  - model: claude                        # claude | deepseek-v4-pro | kimi-k2p5
    count: 3                             # parallel runs (variance control)
    subagent_type: general-purpose       # for Claude only; ignored elsewhere

# REQUIRED — at least one criterion
acceptance:
  # Machine-graded (parsed from events.jsonl)
  - events_contain: run_completed
  - events_contain_count: { kind: step_attested, min: 3 }
  - no_aborts                            # zero run_aborted events
  - leaf_count_complete: 6
  - tool_used: video_editing.hype              # specific orchestrator was started
  - no_cross_project_binding             # session never resolved to a sibling slug

  # Subjective (graded by a checker LLM from the agent's narrative report)
  - subjective:
      - did_search_before_authoring
      - found_existing_pack
      - completed_without_external_help

# OPTIONAL — budget per agent
budget:
  max_tokens_per_agent: 32768
  max_wall_clock_min: 15

# OPTIONAL — tags for filtering (`runner.py --tag skill_trigger`)
tags:
  - skill_trigger
  - vague_request

# OPTIONAL — durable per-scenario adapter metadata (also consumed by Sisypy)
extras:
  project_slug: my_fixture_slug          # example passthrough consumed by adapter.py
  # The following three fields are auto-mirrored by normalize.py during
  # the Sisypy path.  They duplicate top-level keys for backward
  # compatibility.  The legacy harness (runner_legacy, auditor,
  # universal_checks) was decommissioned in M5.  Do not edit these by
  # hand — the normalizer keeps them in sync.
  #   target_orchestrator: <mirrored from top-level>
  #   legacy_acceptance:   <deep-copied from acceptance>
  #   universal_checks:    <moved from assessment.universal_checks>
  m2_checks:                             # single durable trigger source for M2 C3/C4/S1/S2
    c3_no_mutation_on_read:
      enabled: true
    c4_projection_fidelity:
      enabled: true
    s1_append_not_rewrite:
      enabled: true
    s2_idempotent_reattach:
      enabled: true
  # No alternate trigger mechanism is supported for these checks.
  #
  # M4 scenario check declarations (net-new M4 scenarios only)
  m4_checks:                             # dict-valued trigger for M4 deterministic checks;
                                         # each key names an M4 scenario check
    orchestrator_run_persists:           #   e.g. orchestrator_run_persists,
      enabled: true                      #        artifact_pipeline,
    # Additional M4 check keys:          #        timeline_compose_edit, etc.
    #   artifact_pipeline                # Enabled M4 checks produce m4.* result keys
    #   timeline_compose_edit            # in the universal checks output; disabled/
    #   timeline_concurrent_version_conflict  # absent triggers yield na.
    #   taskrun_concurrent_lease
    #   durability_after_crash
    #   timeline_large_audit
  #
  # M4 fixture priming (structural M4 scenarios only)
  m4_fixture:                            # dict controlling deterministic fixture setup
    name: orchestrator_run_persists      #   name: fixture function to invoke during
                                         #        structural-run priming (see adapter.py
                                         #        _prime_m4_fixture); only effective
                                         #        when mode=structural, dispatcher=fake
  # Live shell-dispatch runs skip fixture priming unless the fixture
  # explicitly opts into live seeding.  The fixture writes diagnostic
  # evidence (JSON/JSONL) under project_dir/m4/ for later capture and
  # deterministic M4 check verification.
  #
  # M5 scenario check declarations (net-new M5 scenarios — discovery/authoring/refuse)
  m5_checks:                             # dict-valued trigger for M5 deterministic checks;
                                          # each key names an M5 scenario check
    cross_pack_authoring_discovery:      #   e.g. cross_pack_authoring_discovery,
      enabled: true                      #        broken_authoring_fix_loop,
    # Additional M5 check keys:          #        no_fabricated_tool_id,
    #   broken_authoring_fix_loop        #        projects_runs_sessions_discovered,
    #   no_fabricated_tool_id            #        author_run_revise_loop,
    #   projects_runs_sessions_discovered #       search_fallback_after_zero_hits
    #   author_run_revise_loop           # Enabled M5 checks produce m5.* result keys
    #   search_fallback_after_zero_hits  # in the universal checks output; disabled/
                                         # absent triggers yield na. M5 checks analyze
                                         # textual evidence (stderr.log, report.md,
                                         # brief.md) rather than JSON diagnostics.

# REQUIRED — three-tier assessment model (v10 prep sprint)
#
# NOTE: `universal_checks` has been relocated to `extras.universal_checks`
# by normalize.py (M3 migration).  Both the legacy harness and Sisypy read
# it from extras.  See SCENARIO_MIGRATION.md.
#
# Every signal in the rubric falls into one of three buckets:
#
#   enforced  — load-bearing contracts (binary, gate the test).
#               Only 1–3 questions per scenario. Examples:
#               invoked_via_canonical_cli, produced_required_artifact,
#               did_not_invoke_forbidden_path.
#
#   graded    — semantic quality the assessor can judge (scalar 0.0–1.0).
#               Contributes to `quality_score`, never gates. Examples:
#               report_section_N_substantive, chose_right_tool_first,
#               discovery_path_was_efficient.
#
#   observed  — telemetry / metadata (integer or string, never gates).
#               Examples: shell_calls_count,
#               canonical_bypass_form.
#
# The principle: a measurement is only as strict as its job demands.
# Contracts deserve hard rejection; quality deserves grading; telemetry
# deserves recording. Mixing them into one pass/fail destroys signal.
#
assessment:
  enforced:
    - id: invoked_via_canonical_cli
      question: |
        Did the agent invoke the tool via the canonical `astrid ... run`
        surface rather than `python -m astrid.packs.X.run`?
      evidence: [stderr]
      grading: pass_fail
      weight: 2
      failure_mode: |
        Stderr shows direct python -m invocation of a pack run.py module.

  graded:
    - id: chose_right_tool_first
      question: |
        Did the agent discover and select the canonical tool before
        attempting ad-hoc solutions?
      evidence: [stderr, report]
      grading: pass_fail
      weight: 2
      failure_mode: |
        Agent wrote custom ffmpeg/shell scripts before running any
        `astrid executors search` or `astrid orchestrators list`.

  observed:
    - id: shell_calls_count
      question: "How many shell calls did the agent make? (integer, metadata only)"
      evidence: [stderr]
      grading: numeric
      weight: 0
    # Authoring scenarios also include:
    # - id: canonical_bypass_form
    #   question: "If a canonical-bypass was detected, what form did it take?"
    #   evidence: [stderr]
    #   grading: text
    #   weight: 0
