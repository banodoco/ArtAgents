name: cross_pack_authoring
tier: authoring
description: |
  Agent receives a request to build a new orchestrator that transcribes a
  video with `editorial.transcribe` and then runs `video_editing.hype` on
  the transcript output. The agent must discover both executors via
  `astrid executors search` / `astrid orchestrators search`, author a new
  DSL orchestrator composing them, run `astrid author check` to verify
  compilation, and produce a qualified orchestrator id.

  This probes the authoring-from-scratch + cross-pack composition path:
  can the agent search across two different packs, discover the right
  executors, and wire them into a new orchestrator that compiles cleanly?

  Distinction from `cross_pack_composition`: that scenario tests discovery
  of an *already-existing* composed orchestrator; this one tests *authoring*
  a new orchestrator from scratch that composes executors from two packs.

brief: cross_pack_authoring.md

priming:
- create_project: ${SLUG}

agents:
- model: deepseek-v4-pro
  count: 1
  subagent_type: general-purpose

acceptance:
  # Machine-graded
- no_aborts
  # Subjective
- subjective:
  - discovered_both_pack_executors
  - authored_new_orchestrator
  - author_check_passed
  - qualified_id_correctly

budget:
  max_tokens_per_agent: 65536
  max_wall_clock_min: 30

tags:
- authoring
- cross_pack
- dsl
- discovery

assessment:
  enforced:
  - id: authored_new_orchestrator
    question: |
      Did the agent create a new orchestrator DSL file (not just search
      and invoke existing tools, not hand-write YAML)?
    evidence: [project_tree, stderr]
    grading: pass_fail
    weight: 2
    failure_mode: |
      tree.txt shows no new `.py` DSL file was created under any pack, or
      the agent only ran existing orchestrators without authoring.
  - id: author_check_passed
    question: |
      Did `astrid author check <new_id>` exit 0 against the agent's new
      orchestrator?
    evidence: [stderr]
    grading: pass_fail
    weight: 2
    failure_mode: |
      Stderr shows `astrid author check ...` exiting non-zero, or the
      agent never ran the check at all.
  graded:
  - id: discovered_both_pack_executors
    question: |
      Did the agent discover executors from two different packs (e.g.,
      `editorial.transcribe` and `video_editing.hype`) via search/list
      before authoring the new orchestrator?
    evidence: [stderr, report]
    grading: pass_fail
    weight: 2
    failure_mode: |
      Agent authored an orchestrator referencing only one pack's
      executors, or hand-picked executor ids without searching.
  - id: qualified_id_correctly
    question: |
      Is the new orchestrator id qualified as `<pack>.<name>` rather
      than a bare unqualified name?
    evidence: [project_tree, stderr]
    grading: pass_fail
    weight: 1
  - id: used_canonical_authoring_surface
    question: |
      Did the agent use `astrid author new` / `astrid author check`
      (the canonical authoring surface) rather than inventing a
      non-existent verb or hand-scaffolding?
    evidence: [stderr]
    grading: pass_fail
    weight: 1
    failure_mode: |
      Stderr shows the agent invoking a CLI verb that doesn't exist
      (e.g. `astrid scaffold`, `astrid create-orchestrator`), or
      manually creating pack directories without the author CLI.
  - id: report_shape_intact
    question: |
      Does the report contain each numbered section the brief asked
      for, documenting the discovery and authoring decisions?
    evidence: [report]
    grading: pass_fail
    weight: 1
  observed:
  - id: shell_calls_count
    question: "How many shell calls did the agent make? (integer, metadata only)"
    evidence: [stderr]
    grading: numeric
    weight: 0

extras:
  legacy_acceptance:
  # Machine-graded
  - no_aborts
  # Subjective
  - subjective:
    - discovered_both_pack_executors
    - authored_new_orchestrator
    - author_check_passed
    - qualified_id_correctly

  universal_checks: true
  m2_checks:
    c3_no_mutation_on_read:
      enabled: true
    s1_append_not_rewrite:
      enabled: true
  m5_checks:
    cross_pack_authoring_discovery:
      enabled: true
