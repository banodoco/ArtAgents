name: sequential_orchestrators
tier: core
description: |
  Agent completes `builtin.agent_probe` end-to-end, then starts and completes
  `builtin.mini_research` on the SAME project — without manual `astrid abort`
  between runs. Tests the post-completion handoff: after a run terminates,
  `astrid next` should guide the agent into starting the next orchestrator
  rather than leaving them guessing. Failure mode probed: agents that think
  they have to abort or recreate the project between orchestrators, or that
  can't tell what to start next.

brief: sequential_orchestrators.md

priming:
  - create_project: $SLUG

agents:
  - model: deepseek-v4-pro
    count: 1
    subagent_type: general-purpose

acceptance:
  # Machine-graded
  - events_contain_count: { kind: run_completed, min: 2 }
  - no_aborts

  # Subjective (graded from the agent's narrative report)
  - subjective:
      - astrid_next_suggested_starting_new_orchestrator
      - no_manual_abort_required_between_runs

budget:
  max_tokens_per_agent: 49152
  max_wall_clock_min: 25

tags:
  - sequential
  - handoff
  - multi_orchestrator

assessment:
  universal_checks: true
  enforced:
      - id: no_manual_abort_required_between_runs
        question: |
          Did the agent transition between the first and second
          orchestrator without invoking `astrid abort`, `astrid project
          delete`, or any other destructive cleanup verb?
        evidence: [stderr, events]
        grading: pass_fail
        weight: 2
        failure_mode: |
          Stderr contains `astrid abort` between the two runs, or events
          show a `run_aborted`.
      - id: two_distinct_runs_completed
        question: |
          Did the project end with two distinct `run_completed` events,
          one for each orchestrator (agent_probe + mini_research), in
          sequence?
        evidence: [events]
        grading: pass_fail
        weight: 2
      - id: invoked_both_via_canonical_cli
        question: |
          Were both orchestrators started via `astrid orchestrators run`
          (or `astrid start`) rather than `python -m astrid.packs.X.run`
          / a direct import?
        evidence: [stderr]
        grading: pass_fail
        weight: 2
  graded:
      - id: astrid_next_suggested_starting_new_orchestrator
        question: |
          After the first orchestrator's `run_completed`, did `astrid
          next` (or equivalent CLI output) tell the agent to start the
          second orchestrator rather than leaving them guessing?
        evidence: [stderr, report]
        grading: pass_fail
        weight: 1
        failure_mode: |
          Stderr after run_completed shows the agent searching for what
          to do (manual `orchestrators list`/grepping the report) before
          running `astrid next`, OR `astrid next` returned an unhelpful
          message and the agent guessed at the next orchestrator.
      - id: report_describes_handoff
        question: |
          Does the report describe the handoff between the two
          orchestrators (what `astrid next` said, what triggered the
          second start)?
        evidence: [report]
        grading: pass_fail
        weight: 1
  observed:
    - id: shell_calls_count
      question: "How many shell calls did the agent make? (integer, metadata only)"
      evidence: [stderr]
      grading: numeric
      weight: 0