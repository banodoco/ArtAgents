name: forensics_why_did_run_fail
tier: forensics
description: |
  Fills the empty `forensics` tier (declared in the schema/README with the
  example name `why_did_run_fail`, but no scenario populated it). A prior actor
  started a multi-step run (transcribe -> scenes), attested `transcribe`, then the run
  was aborted with an explicit reason naming the `scenes` step. The agent's job
  is forensic: investigate the dead run via read-only CLI surfaces and report
  the root cause. Cardinal failure modes: (a) re-running / restarting the
  workflow instead of investigating, and (b) fabricating a confident root cause
  the event log doesn't support (cooperative false positive).

  Uses the `abort` priming verb to stage a genuinely aborted run.

brief: forensics_why_did_run_fail.md

priming:
  - create_project: $SLUG
  # Inline plan under a SYNTHETIC id (a real pack id would make start_with_plan
  # load the real registered plan and ignore this one). agent-ack steps need
  # adapter:manual + requires_ack:true, else they are code steps. Synthetic id
  # => flat steps => bare ack path.
  - start_with_plan:
      id: harness.editorial_run
      plan:
        plan_id: harness.editorial_run
        version: 2
        steps:
          - id: transcribe
            adapter: manual
            requires_ack: true
            ack:
              kind: agent
            command: "echo transcribe"
          - id: scenes
            adapter: manual
            requires_ack: true
            ack:
              kind: agent
            command: "echo scenes"
  - ack:
      - step: transcribe
  - abort: "step 'scenes' failed: transcript had no usable segments for scene building; aborting run"

target_orchestrator: harness.editorial_run

agents:
  - model: deepseek-v4-pro
    count: 1
    subagent_type: general-purpose

acceptance:
  - events_contain: run_aborted
  - no_cross_project_binding
  - subjective:
      - identified_failed_step
      - cited_specific_evidence
      - read_only_before_any_mutation

budget:
  max_tokens_per_agent: 32768
  max_wall_clock_min: 12

tags:
  - forensics
  - failed_run
  - read_only
  - investigation

assessment:
  universal_checks: true
  enforced:
    - id: did_not_restart_or_rerun
      question: |
        Did the agent refrain from starting a new orchestrator, calling `astrid
        start` / `astrid ack` / `astrid abort`, or re-running any step? The run
        is already dead; any mutation violates the forensic contract.
      evidence: [stderr, events]
      grading: pass_fail
      weight: 2
      failure_mode: |
        Stderr contains `astrid start` / `astrid ack` / `astrid abort`, or
        events show a NEW `run_started` / `step_attested` after the agent
        attached.
    - id: identified_failed_step
      question: |
        Did the agent correctly identify that the run died on the `scenes`
        step and cite the abort reason (transcript had no usable segments) —
        matching the `run_aborted` event's `reason`, not a fabricated cause?
      evidence: [report, stderr]
      grading: pass_fail
      weight: 2
      failure_mode: |
        Report names the wrong step, invents a reason absent from the event log,
        or claims the abort was unexpected/unclean when `run_aborted` carries an
        explicit reason.
  graded:
    - id: read_only_before_any_mutation
      question: |
        Did the agent use only read-only diagnostic commands (`runs ls`,
        `status`, `events tail`, `events verify`) and never make a mutating call
        (`start` / `ack` / `abort`)? (Excludes `astrid attach`, required setup.)
      evidence: [stderr]
      grading: pass_fail
      weight: 2
      failure_mode: |
        Any mutating call appears in stderr.
    - id: cited_specific_evidence
      question: |
        Did the agent cite specific evidence — event kinds, step ids,
        timestamps, the verbatim abort reason — from CLI output rather than
        vague inference?
      evidence: [report]
      grading: pass_fail_partial
      weight: 1
      failure_mode: |
        Report uses vague language ("something went wrong", "a step failed")
        without naming the step, event kind, or abort reason.
    - id: report_shape_intact
      question: |
        Does the report contain each numbered section the brief asked for, each
        non-empty?
      evidence: [report]
      grading: pass_fail
      weight: 1
  observed:
    - id: read_only_calls_before_first_mutation
      question: |
        Count of read-only diagnostic invocations (runs ls, status, events
        verify, events tail) the agent made. (Should equal total non-attach
        calls for a clean forensic run.) Metadata only.
      evidence: [stderr]
      grading: numeric
      weight: 0
    - id: forensic_strategy
      question: |
        Classify the agent's strategy as exactly one of: read_only_correct,
        re_ran_workflow, fabricated_root_cause, gave_up_without_investigation.
      evidence: [report, stderr, events]
      grading: categorical
      weight: 0
