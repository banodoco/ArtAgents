name: taskrun_concurrent_lease
tier: forensics
description: |
  Structural M4 scenario verifying single-writer lease enforcement for
  concurrent task-run access.  The fixture creates a lease.json for one
  writer, attempts a conflicting write with a different epoch, and records
  the deterministic StaleEpochError/NotWriterError rejection.  The winner's
  events.jsonl remains valid and the frozen lease.json is captured as
  evidence.
mode: structural

brief: taskrun_concurrent_lease.md

priming:
  - create_project: ${SLUG}

agents:
  - model: ""
    dispatcher: fake
    count: 1

budget:
  max_tokens_per_agent: 0
  max_wall_clock_min: 1

tags:
  - m4
  - taskrun
  - lease
  - concurrency
  - structural

extras:
  m4_fixture:
    name: taskrun_concurrent_lease
  m4_checks:
    taskrun_concurrent_lease:
      enabled: true

assessment:
  universal_checks: false
  enforced: []
  graded: []
  observed: []
