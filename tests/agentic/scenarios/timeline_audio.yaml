name: timeline_audio
tier: core
description: |
  Agent exercises timeline audio binding verbs (audio.bound,
  audio.unbound). Asserts edit verbs append event envelopes and
  read-only commands do not mutate the event log.

brief: timeline_audio.md

priming:
  - create_project: $SLUG

target_orchestrator: video_editing.hype

agents:
  - model: deepseek-v4-pro
    count: 1
    subagent_type: general-purpose

acceptance:
  - no_aborts
  - events_contain: audio.bound
  - events_contain: audio.unbound
  - no_cross_project_binding
  - subjective:
      - exercised_audio_verbs
      - verified_event_log
      - confirmed_read_only_no_mutation

budget:
  max_tokens_per_agent: 32768
  max_wall_clock_min: 10

tags:
  - timeline
  - audio
  - edit_verb

assessment:
  universal_checks: true
  enforced:
    - id: invoked_via_canonical_cli
      question: "Did the agent use canonical CLI surface?"
      evidence: [stderr]
      grading: pass_fail
      weight: 2
    - id: event_log_contains_edit_verbs
      question: "Does assembly.jsonl contain audio.bound and audio.unbound events?"
      evidence: [project_tree, report]
      grading: pass_fail
      weight: 2
    - id: read_only_no_mutation
      question: "Did read-only commands leave the event log unchanged?"
      evidence: [stderr, project_tree, report]
      grading: pass_fail
      weight: 1
  graded:
    - id: report_shape_intact
      question: "Does the report contain the required sections?"
      evidence: [report]
      grading: pass_fail
      weight: 1
  observed:
    - id: shell_calls_count
      question: "How many shell calls did the agent make?"
      evidence: [stderr]
      grading: numeric
      weight: 0
