name: timeline_clip
tier: core
description: |
  Agent exercises timeline clip edit verbs (clip.added, clip.removed,
  clip.moved) through the canonical CLI. Asserts that edit verbs append
  event envelopes and read-only show does not mutate the event log.

brief: timeline_clip.md

priming:
  - create_project: $SLUG

target_orchestrator: builtin.hype

agents:
  - model: deepseek-v4-pro
    count: 1
    subagent_type: general-purpose

acceptance:
  - no_aborts
  - events_contain: clip.added
  - events_contain: clip.removed
  - no_cross_project_binding
  - subjective:
      - exercised_clip_verbs
      - verified_event_log
      - confirmed_read_only_no_mutation

budget:
  max_tokens_per_agent: 32768
  max_wall_clock_min: 10

tags:
  - timeline
  - clip
  - edit_verb

assessment:
  universal_checks: true
  enforced:
    - id: invoked_via_canonical_cli
      question: |
        Did the agent invoke timeline commands via `astrid timelines ...`
        rather than `python -m astrid.packs.*` or direct imports?
      evidence: [stderr]
      grading: pass_fail
      weight: 2
      failure_mode: |
        Stderr shows direct `python -m astrid.packs.*` invocation instead
        of `astrid timelines` CLI.
    - id: event_log_contains_edit_verbs
      question: |
        Does assembly.jsonl contain at least clip.added and clip.removed
        events after the agent's operations?
      evidence: [project_tree, report]
      grading: pass_fail
      weight: 2
      failure_mode: |
        assembly.jsonl is missing expected clip domain events; the agent
        may have bypassed the event log.
    - id: read_only_show_no_mutation
      question: |
        Did `astrid timelines show` leave the event log unchanged?
        Event count must be identical before and after the show command.
      evidence: [stderr, project_tree, report]
      grading: pass_fail
      weight: 1
      failure_mode: |
        The event log grew after a read-only show — the read path is
        accidentally mutating state.
  graded:
    - id: report_shape_intact
      question: |
        Does the report contain at least sections on what was done,
        event log content, read-only verification, and a UX gap?
      evidence: [report]
      grading: pass_fail
      weight: 1
  observed:
    - id: shell_calls_count
      question: "How many shell calls did the agent make?"
      evidence: [stderr]
      grading: numeric
      weight: 0
