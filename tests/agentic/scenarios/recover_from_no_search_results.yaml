name: recover_from_no_search_results
tier: discovery
description: |
  Agent is asked to find a tool for a capability where the first search
  returns zero hits. The agent must not conclude "nothing exists" after
  one empty query — it must rephrase, broaden, or fall back to `list`
  before reaching a conclusion.

  This probes the search-recovery path: can the agent handle a zero-results
  response without giving up prematurely, and does it use multiple
  discovery strategies (keyword variation, broadening, listing)?

  The target capability is deliberately obscure but plausible (e.g.,
  "batch-retime clip segments to a target duration using a tempo map")
  so the first naive search is likely to return nothing.

brief: recover_from_no_search_results.md

priming:
- create_project: ${SLUG}

agents:
- model: deepseek-v4-pro
  count: 1
  subagent_type: general-purpose

acceptance:
  # Subjective
- subjective:
  - tried_multiple_search_formulations
  - did_not_stop_after_first_empty
  - fell_back_to_list_or_broaden
  - reported_honest_conclusion

budget:
  max_tokens_per_agent: 32768
  max_wall_clock_min: 12

tags:
- discovery
- search
- recovery
- resilience

assessment:
  enforced:
  - id: tried_multiple_search_formulations
    question: |
      Did the agent attempt at least 2 distinct search queries with
      different terms before concluding?
    evidence: [stderr]
    grading: pass_fail
    weight: 2
    failure_mode: |
      Agent ran only one search query, got zero results, and immediately
      declared "no matching tool exists" without trying alternative terms
      or broadening.
  - id: did_not_stop_after_first_empty
    question: |
      After the first search returned zero hits, did the agent try a
      different approach (different keywords, `list`, broader search)
      rather than stopping?
    evidence: [stderr]
    grading: pass_fail
    weight: 2
    failure_mode: |
      Stderr shows exactly one search invocation followed immediately by
      a "nothing found" conclusion with no further discovery attempts.
  graded:
  - id: fell_back_to_list_or_broaden
    question: |
      Did the agent use `astrid executors list` or `astrid orchestrators
      list` as a fallback, or broaden the search terms significantly,
      after initial zero-hit results?
    evidence: [stderr]
    grading: pass_fail
    weight: 1
  - id: reported_honest_conclusion
    question: |
      Did the agent's conclusion accurately reflect what was found (or
      not found), without overclaiming or fabricating?
    evidence: [report]
    grading: pass_fail
    weight: 1
  - id: report_shape_intact
    question: |
      Does the report document the search process, including the failed
      queries and the fallback strategy?
    evidence: [report]
    grading: pass_fail
    weight: 1
  observed:
  - id: shell_calls_count
    question: "How many shell calls did the agent make? (integer, metadata only)"
    evidence: [stderr]
    grading: numeric
    weight: 0
  - id: search_attempts_count
    question: "How many distinct search/list invocations did the agent make? (integer, metadata only)"
    evidence: [stderr]
    grading: numeric
    weight: 0

extras:
  legacy_acceptance:
  # Subjective
  - subjective:
    - tried_multiple_search_formulations
    - did_not_stop_after_first_empty
    - fell_back_to_list_or_broaden
    - reported_honest_conclusion

  universal_checks: true
  m2_checks:
    c3_no_mutation_on_read:
      enabled: true
  m5_checks:
    search_fallback_after_zero_hits:
      enabled: true
