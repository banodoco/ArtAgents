name: vague_video_request
tier: discovery
description: |
  Agent receives an open-ended creative-video request with no tool name and
  no `hype` hint. They must discover via search/list that `video_editing.hype` is
  the canonical "make something interesting from a video" orchestrator
  instead of inventing their own ffmpeg/edit pipeline. Failure mode probed:
  agents reach for shell-level tools (ffmpeg, moviepy) before searching the
  pack registry.

brief: vague_video_request.md

priming:
  - create_project: $SLUG

target_orchestrator: video_editing.hype

agents:
  - model: deepseek-v4-pro
    count: 1
    subagent_type: general-purpose

acceptance:
  # Machine-graded. This is a *discovery* scenario: the success
  # signal is "the agent found `video_editing.hype` and tried to invoke
  # it." We deliberately don't require run_completed — agents
  # working from a synthesized placeholder video will hit
  # legitimate downstream failures (e.g. empty transcript) and
  # may abort the run rather than push past them. Discovery
  # succeeded either way.
  - tool_used: video_editing.hype
  # Subjective (graded from the agent's narrative report)
  - subjective:
      - discovered_via_orchestrators_list_or_search
      - read_pack_skill_before_running
      - did_not_reinvent_pipeline_from_scratch

budget:
  max_tokens_per_agent: 32768
  max_wall_clock_min: 15

tags:
  - skill_trigger
  - vague_request
  - discovery

assessment:
  universal_checks: true
  enforced:
      - id: invoked_via_canonical_cli
        question: |
          Did the agent invoke the tool via `astrid orchestrators run
          video_editing.hype` rather than `python -m astrid.packs.video_editing.hype`?
        evidence: [stderr]
        grading: pass_fail
        weight: 2
  graded:
      - id: discovered_via_orchestrators_list_or_search
        question: |
          Did the agent discover `video_editing.hype` via `astrid orchestrators
          search` or `astrid orchestrators list` (or the executors
          equivalent) — i.e. via the canonical discovery surface, not via
          grepping `astrid/packs/`?
        evidence: [stderr]
        grading: pass_fail
        weight: 2
        failure_mode: |
          First mention of "hype" in stderr is in a `grep` or `find`
          command against the source tree.
      - id: read_pack_skill_before_running
        question: |
          Did the agent read the pack's STAGE / SKILL doc (via `astrid
          orchestrators inspect`, reading `STAGE.md`, or similar) BEFORE
          attempting to invoke it?
        evidence: [stderr, report]
        grading: pass_fail
        weight: 1
        failure_mode: |
          Stderr shows `astrid orchestrators run video_editing.hype` (or `python
          -m astrid.packs.video_editing.hype`) before any read of STAGE.md or
          `orchestrators inspect`.
      - id: did_not_reinvent_pipeline_from_scratch
        question: |
          Did the agent avoid building their own ffmpeg/moviepy pipeline
          and instead rely on `video_editing.hype` (even if only as a `--dry-run`
          invocation)?
        evidence: [stderr, report]
        grading: pass_fail
        weight: 2
        failure_mode: |
          Stderr contains substantive `ffmpeg`/`moviepy` invocations
          beyond placeholder-video synthesis (`anullsrc`/`testsrc`).
      - id: report_explains_discovery_path
        question: |
          Does the report's "what tools you discovered" section explicitly
          describe the discovery path (which command surfaced hype, which
          doc they read)?
        evidence: [report]
        grading: pass_fail
        weight: 1
  observed:
    - id: shell_calls_count
      question: "How many shell calls did the agent make? (integer, metadata only)"
      evidence: [stderr]
      grading: numeric
      weight: 0