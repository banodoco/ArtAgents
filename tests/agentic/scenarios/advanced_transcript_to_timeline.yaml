name: advanced_transcript_to_timeline
tier: advanced
description: |
  Tests the data hand-off seam between an upstream tool's output and the
  timeline. A transcript fixture (segments with start/end/text) is primed; the
  agent picks the punchiest quotes and places each as a timeline clip whose
  in/out points come FROM the transcript timestamps. Probes whether the agent
  routes temporal data faithfully across the seam — the failure mode is clips
  placed at guessed/rounded times that don't match the transcript. No upstream
  transcription is run (the transcript is given), so the test isolates the
  hand-off, not the ASR.

brief: advanced_transcript_to_timeline.md

priming:
  - create_project: $SLUG
  - write:
      path: /tmp/interview_transcript.json
      content: |
        {"segments": [
          {"start": 3.0, "end": 7.5, "text": "The biggest mistake we made early on was shipping too fast."},
          {"start": 12.0, "end": 16.2, "text": "Honestly, our users taught us everything we know."},
          {"start": 21.5, "end": 25.0, "text": "I almost quit three times in the first year."},
          {"start": 31.0, "end": 35.8, "text": "The moment it clicked was when we stopped guessing."},
          {"start": 42.0, "end": 46.5, "text": "If I could tell my younger self one thing: listen more."},
          {"start": 51.0, "end": 54.0, "text": "We got lucky, but luck favors the persistent."}
        ]}

agents:
  - model: deepseek-v4-pro
    count: 1
    subagent_type: general-purpose

acceptance:
  - no_aborts
  - events_contain: clip.added
  - no_cross_project_binding
  - subjective:
      - placed_clips_at_transcript_timestamps
      - did_not_fabricate_timestamps
      - selected_five_quotes
      - used_canonical_cli

budget:
  max_tokens_per_agent: 32768
  max_wall_clock_min: 15

tags:
  - advanced
  - composition
  - timeline
  - data_handoff

assessment:
  universal_checks: true
  enforced:
    - id: placed_clips_at_transcript_timestamps
      question: |
        Do the timeline clips' in/out points match the `start`/`end` of the
        transcript segments the agent chose (read /tmp/interview_transcript.json
        and compare to the clip.added events / report)? The boundaries must come
        from the transcript, not rounded or invented.
      evidence: [events, report]
      grading: pass_fail
      weight: 2
      failure_mode: |
        Clip in/out points don't correspond to any transcript segment's
        start/end, or are rounded to whole seconds when the transcript had
        fractional times (e.g. a clip at 0-5 when the quote is 3.0-7.5).
    - id: did_not_fabricate_timestamps
      question: |
        Are all clip boundaries traceable to actual segments in the primed
        transcript — no clips at timestamps that appear nowhere in it?
      evidence: [events, report]
      grading: pass_fail
      weight: 2
      failure_mode: |
        A clip uses start/end values absent from the transcript — the agent
        invented timings instead of carrying them across the seam.
    - id: used_canonical_cli
      question: |
        Did the agent build the timeline via `astrid timelines ...` rather than
        hand-editing the event log or `python -m astrid.packs.*`?
      evidence: [stderr]
      grading: pass_fail
      weight: 1
      failure_mode: |
        Direct event-log edits or `python -m astrid.packs.*` in stderr.
  graded:
    - id: selected_five_quotes
      question: |
        Did the agent select five distinct quote segments (clip.added count ~5)
        and explain its picks in the report?
      evidence: [events, report]
      grading: pass_fail_partial
      weight: 1
      failure_mode: |
        Far fewer/more than five clips, or no rationale for the selection.
    - id: report_maps_clips_to_segments
      question: |
        Does the report's placement section show, per clip, the in/out it set
        and the transcript start/end it came from (demonstrating the match)?
      evidence: [report]
      grading: pass_fail
      weight: 1
      failure_mode: |
        Report doesn't tie clips back to specific transcript segments.
  observed:
    - id: shell_calls_count
      question: "How many shell calls did the agent make? (integer, metadata only)"
      evidence: [stderr]
      grading: numeric
      weight: 0
    - id: clip_added_count
      question: "How many clip.added events are in the log? (integer, metadata only)"
      evidence: [events]
      grading: numeric
      weight: 0
