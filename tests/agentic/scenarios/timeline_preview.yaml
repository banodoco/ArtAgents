name: timeline_preview
tier: core
description: |
  Agent verifies that `astrid timelines preview` is read-only — it
  describes the timeline without appending any events. Event log must
  be byte-identical before and after the preview command.

brief: timeline_preview.md

priming:
  - create_project: $SLUG

target_orchestrator: video_editing.hype

agents:
  - model: deepseek-v4-pro
    count: 1
    subagent_type: general-purpose

acceptance:
  - no_aborts
  - no_cross_project_binding
  - subjective:
      - verified_preview_read_only
      - event_log_unchanged
      - preview_output_describes_timeline

budget:
  max_tokens_per_agent: 32768
  max_wall_clock_min: 10

tags:
  - timeline
  - preview
  - read_only

assessment:
  universal_checks: true
  enforced:
    - id: invoked_via_canonical_cli
      question: "Did the agent use canonical CLI surface?"
      evidence: [stderr]
      grading: pass_fail
      weight: 2
    - id: read_only_no_mutation
      question: |
        Is the event log byte-identical before and after the preview
        command? Event count and content must not change.
      evidence: [stderr, project_tree, report]
      grading: pass_fail
      weight: 2
      failure_mode: |
        The event log grew or changed after a read-only preview command.
  graded:
    - id: report_shape_intact
      question: "Does the report contain the required sections?"
      evidence: [report]
      grading: pass_fail
      weight: 1
  observed:
    - id: shell_calls_count
      question: "How many shell calls did the agent make?"
      evidence: [stderr]
      grading: numeric
      weight: 0
