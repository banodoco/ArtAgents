name: specific_transcribe
tier: discovery
description: |
  Agent receives a specific, well-scoped request to transcribe an audio
  file. The canonical Astrid answer is `builtin.transcribe`. Failure mode
  probed: agent skips the registry and writes a one-off whisper wrapper
  (or pip-installs openai-whisper, or calls the OpenAI API directly)
  instead of finding the existing executor.

brief: specific_transcribe.md

priming:
  - create_project: $SLUG

target_orchestrator: builtin.transcribe

agents:
  - model: deepseek-v4-pro
    count: 1
    subagent_type: general-purpose

acceptance:
  # Machine-graded
  - no_aborts
  - tool_used: builtin.transcribe
  # Subjective
  - subjective:
      - found_transcribe_executor
      - did_not_write_own_whisper_wrapper
      - used_executors_list_or_search

budget:
  max_tokens_per_agent: 32768
  max_wall_clock_min: 10

tags:
  - skill_trigger
  - specific_request
  - discovery

assessment:
  universal_checks: true
  enforced:
      - id: invoked_via_canonical_cli
        question: |
          Did the agent invoke the tool via `astrid executors run
          builtin.transcribe ...`, as opposed to `python -m
          astrid.packs.builtin.executors.transcribe.run ...` or a direct import?
        evidence: [stderr]
        grading: pass_fail
        weight: 2
        failure_mode: |
          Stderr or report shows `python3? -m astrid.packs.builtin.transcribe`
          or `from astrid.packs.builtin.executors.transcribe import` instead of
          `astrid executors run builtin.transcribe`.
      - id: did_not_install_own_whisper
        question: |
          Did the agent avoid pip-installing `openai-whisper`, writing a
          one-off `openai.audio.transcriptions` wrapper, or shelling out
          to `whisper` directly? Covers `did_not_write_own_whisper_wrapper`.
        evidence: [stderr]
        grading: pass_fail
        weight: 1
        failure_mode: |
          `pip install openai-whisper`, `import openai` for transcription, or
          a `whisper /tmp/audio_example.mp3` shell call appears in stderr.
      - id: produced_transcript_artifact
        question: |
          Did the run produce a `transcript.json` (or `.srt` / `.txt`) on
          disk under the project's `runs/` tree or the `--out` directory
          the agent chose? Covers `found_transcribe_executor` end-to-end.
        evidence: [project_tree, report]
        grading: pass_fail
        weight: 1
        failure_mode: |
          tree.txt has no transcript output anywhere; the report describes
          running the executor but no produced artifact path is visible.
  graded:
      - id: discovered_via_canonical_search
        question: |
          Did the agent discover `builtin.transcribe` via the canonical CLI
          path (`astrid executors search transcribe` or `astrid executors
          list`), as opposed to grepping source files or reading
          astrid/packs/ directly?
        evidence: [stderr, report]
        grading: pass_fail_partial
        weight: 1
        failure_mode: |
          Stderr shows `grep transcribe astrid/packs/...` or
          `find astrid/packs/ -name '*transcribe*'` BEFORE any
          `astrid executors search` invocation. Covers
          `used_executors_list_or_search`.
      - id: report_shape_intact
        question: |
          Does the report contain all 4 numbered sections the brief asked
          for (What you did, What tools you discovered, Discoverability
          notes, Biggest UX gap), each with at least one non-empty
          sentence?
        evidence: [report]
        grading: pass_fail
        weight: 1
        failure_mode: |
          Missing or empty section under heading `## 1.`, `## 2.`, `## 3.`,
          or `## 4.` (or bold/bullet-numbered equivalents).
  observed:
    - id: shell_calls_count
      question: "How many shell calls did the agent make? (integer, metadata only)"
      evidence: [stderr]
      grading: numeric
      weight: 0