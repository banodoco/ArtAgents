<div id="song-segment-clock">
  <svg id="song-segment-clock-svg" viewBox="0 0 1000 292" role="img" aria-labelledby="song-segment-clock-title song-segment-clock-desc">
    <title id="song-segment-clock-title">Proposed segment clock for Runaway</title>
    <desc id="song-segment-clock-desc">A full-song timeline divided into sections with one even transition interval inside each section, plus bar-level piano activity evidence.</desc>
    <g id="segment-layer"></g>
    <g id="evidence-layer"></g>
    <g id="axis-layer"></g>
  </svg>
  <div class="viz-row text-small" aria-label="Rhythm legend">
    <span><span class="clock-key clock-key-sparse"></span>Half-note pulse</span>
    <span><span class="clock-key clock-key-fast"></span>Sixteenth drive</span>
    <span><span class="clock-key clock-key-mid"></span>Eighth-note bridge</span>
    <span><span class="clock-key clock-key-taper"></span>Quarter-note taper</span>
  </div>
</div>

<style>
  #song-segment-clock {
    width: 100%;
    color: var(--foreground);
  }

  #song-segment-clock svg {
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
  }

  #song-segment-clock .segment-label {
    fill: var(--foreground);
    font-size: 12px;
    font-weight: 500;
    text-anchor: middle;
  }

  #song-segment-clock .segment-time,
  #song-segment-clock .lane-label,
  #song-segment-clock .axis-label {
    fill: var(--muted-foreground);
    font-size: 11px;
    font-weight: 400;
  }

  #song-segment-clock .segment-time {
    text-anchor: middle;
  }

  #song-segment-clock .axis-label {
    text-anchor: middle;
  }

  #song-segment-clock .boundary,
  #song-segment-clock .axis-line {
    stroke: var(--border);
    stroke-width: 1;
  }

  #song-segment-clock .clock-tick {
    stroke: currentColor;
    stroke-width: 1;
    opacity: 0.62;
  }

  #song-segment-clock .evidence-cell {
    fill: var(--viz-series-1);
  }

  #song-segment-clock .clock-key {
    display: inline-block;
    width: 12px;
    height: 12px;
    margin-right: 5px;
    vertical-align: -2px;
    background: var(--viz-series-1);
  }

  #song-segment-clock .clock-key-fast {
    background: var(--viz-series-2);
  }

  #song-segment-clock .clock-key-mid {
    background: var(--viz-series-3);
  }

  #song-segment-clock .clock-key-taper {
    background: var(--viz-series-5);
  }
</style>

<script>
(() => {
  const root = document.getElementById("song-segment-clock");
  const svg = root.querySelector("#song-segment-clock-svg");
  const segmentLayer = root.querySelector("#segment-layer");
  const evidenceLayer = root.querySelector("#evidence-layer");
  const axisLayer = root.querySelector("#axis-layer");
  const ns = "http://www.w3.org/2000/svg";
  const duration = 168.44;
  const left = 52;
  const right = 982;
  const width = right - left;
  const x = (seconds) => left + (seconds / duration) * width;

  const segments = [
    { start: 0, end: 23.54, label: "Sparse pulse", short: "½", interval: 1.5, series: 1 },
    { start: 23.54, end: 48.29, label: "Drive A", short: "¹⁄₁₆", interval: 0.1875, series: 2 },
    { start: 48.29, end: 51.29, label: "Bridge", short: "⅛", interval: 0.375, series: 3 },
    { start: 51.29, end: 90.29, label: "Drive B", short: "¹⁄₁₆", interval: 0.1875, series: 2 },
    { start: 90.29, end: 96.29, label: "Reset", short: "⅛", interval: 0.375, series: 3 },
    { start: 96.29, end: 123.29, label: "Drive C", short: "¹⁄₁₆", interval: 0.1875, series: 2 },
    { start: 123.29, end: 135.29, label: "Breathing", short: "⅛", interval: 0.375, series: 3 },
    { start: 135.29, end: 147.29, label: "Reprise", short: "¹⁄₁₆", interval: 0.1875, series: 2 },
    { start: 147.29, end: 162.29, label: "Taper", short: "¼", interval: 0.75, series: 5 },
    { start: 162.29, end: 168.44, label: "Outro", short: "½", interval: 1.5, series: 6 }
  ];

  const occupancy = [
    2, 2, 2, 2, 2, 2, 2, 4,
    16, 16, 16, 16, 15, 16, 15, 12,
    10, 15, 16, 15, 13, 16, 16, 16,
    16, 14, 16, 15, 16, 15, 11, 12,
    14, 14, 15, 16, 15, 15, 15, 16,
    15, 11, 11, 9, 12, 14, 14, 15,
    13, 13, 11, 9, 8, 9, 0, 1
  ];

  const make = (name, attrs = {}) => {
    const node = document.createElementNS(ns, name);
    Object.entries(attrs).forEach(([key, value]) => node.setAttribute(key, String(value)));
    return node;
  };

  const laneLabel = make("text", { x: 0, y: 76, class: "lane-label" });
  laneLabel.textContent = "Clock";
  segmentLayer.appendChild(laneLabel);

  segments.forEach((segment) => {
    const x1 = x(segment.start);
    const x2 = x(segment.end);
    const segmentWidth = x2 - x1;
    const group = make("g");
    const rect = make("rect", {
      x: x1,
      y: 50,
      width: segmentWidth,
      height: 98,
      fill: `color-mix(in srgb, var(--viz-series-${segment.series}) 22%, transparent)`
    });
    group.appendChild(rect);

    const tickColor = `var(--viz-series-${segment.series})`;
    for (let t = segment.start; t < segment.end; t += segment.interval) {
      group.appendChild(make("line", {
        x1: x(t),
        y1: 94,
        x2: x(t),
        y2: 146,
        class: "clock-tick",
        style: `color:${tickColor}`
      }));
    }

    group.appendChild(make("line", {
      x1,
      y1: 42,
      x2: x1,
      y2: 150,
      class: "boundary"
    }));

    const label = make("text", {
      x: (x1 + x2) / 2,
      y: 72,
      class: "segment-label"
    });
    label.textContent = segmentWidth > 72 ? segment.label : segment.short;
    group.appendChild(label);

    if (segmentWidth > 54) {
      const time = make("text", {
        x: (x1 + x2) / 2,
        y: 88,
        class: "segment-time"
      });
      time.textContent = `${segment.start.toFixed(0)}–${segment.end.toFixed(0)}s`;
      group.appendChild(time);
    }

    segmentLayer.appendChild(group);
  });

  segmentLayer.appendChild(make("line", {
    x1: right,
    y1: 42,
    x2: right,
    y2: 150,
    class: "boundary"
  }));

  const evidenceLabel = make("text", { x: 0, y: 190, class: "lane-label" });
  evidenceLabel.textContent = "Piano";
  evidenceLayer.appendChild(evidenceLabel);

  const barWidth = width / occupancy.length;
  occupancy.forEach((count, index) => {
    evidenceLayer.appendChild(make("rect", {
      x: left + index * barWidth,
      y: 172,
      width: Math.max(1, barWidth - 1),
      height: 28,
      class: "evidence-cell",
      opacity: 0.1 + 0.82 * (count / 16)
    }));
  });

  axisLayer.appendChild(make("line", {
    x1: left,
    y1: 232,
    x2: right,
    y2: 232,
    class: "axis-line"
  }));

  for (let seconds = 0; seconds <= 165; seconds += 15) {
    const px = x(seconds);
    axisLayer.appendChild(make("line", {
      x1: px,
      y1: 228,
      x2: px,
      y2: 237,
      class: "axis-line"
    }));
    const label = make("text", {
      x: px,
      y: 253,
      class: "axis-label"
    });
    const minutes = Math.floor(seconds / 60);
    const remainder = String(seconds % 60).padStart(2, "0");
    label.textContent = `${minutes}:${remainder}`;
    axisLayer.appendChild(label);
  }
})();
</script>
