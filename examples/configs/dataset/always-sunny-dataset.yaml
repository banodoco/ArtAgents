schema_version: 1
media_type: video
dataset_id: always-sunny-chaos-v1
description: Generic builtin.dataset_build config for an Always Sunny-style LTX training dataset.

sources:
  - provider: youtube
    config:
      source_urls:
        - "https://www.youtube.com/watch?v=REPLACE_WITH_LICENSED_SOURCE"
      max_results_per_query: 1
      download_format: mp4

buckets:
  bar_argument_escalation:
    target_count: 30
    description: Bar or back-office scenes where a selfish plan escalates through fast ensemble argument.
    search_queries:
      - "Always Sunny bar argument scene"

clip_config:
  min_duration_s: 2.0
  max_duration_s: 7.0
  max_scenes_per_source: 20

caption:
  provider: visual_understand
  prompt_template: >-
    Write a concise training caption for this chaotic ensemble bar-comedy clip.
    Include the dingy setting, visible character grouping, camera framing,
    argument energy, selfish scheme, and physical blocking. Do not mention
    filenames, episode titles, or review labels.

filters:
  duration:
    enabled: true
    min_s: 2.0
    max_s: 7.0

review:
  enabled: true
  reject_reasons:
    - watermark
    - wrong_scene
    - wrong_character
    - bad_motion
    - low_quality
    - wrong_content
    - rights_concern
    - other

manifest:
  adapter: ai-toolkit-ltx

budgets:
  max_api_calls: 250
  max_estimated_cost_usd: 15.0
  providers:
    caption.visual_understand:
      max_calls: 125
      rate_limit_per_minute: 30
    bucket_judge.visual_understand:
      max_calls: 125
      rate_limit_per_minute: 30

output:
  run_dir: runs/always-sunny-dataset

extensions:
  bucket_judge:
    enabled: true
    provider: visual_understand
    buckets:
      - bar_argument_escalation
    prompt_template: >-
      Classify this clip into the configured bucket: {buckets}. Accept only
      clean ensemble bar-comedy footage with fast argument escalation and
      grounded blocking. Reject commercials, interviews, title cards,
      watermarked uploads, compilations with heavy edits, and off-topic clips.
      Return strict JSON with accept, bucket, reason, and score.
