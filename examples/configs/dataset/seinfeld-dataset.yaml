schema_version: 1
media_type: video
dataset_id: seinfeld-ltx-style-v1
description: "Generic training.dataset_build config for a Seinfeld-style LTX training dataset (legacy alias: builtin.dataset_build)."

sources:
  - provider: youtube
    config:
      source_urls:
        - "https://www.youtube.com/watch?v=REPLACE_WITH_LICENSED_SOURCE"
      max_results_per_query: 3
      download_format: mp4

buckets:
  apartment_group_dialogue:
    target_count: 40
    description: Jerry's apartment group conversations with medium shots and sitcom blocking.
    search_queries:
      - "Seinfeld apartment conversation scene"
      - "Seinfeld Jerry apartment group dialogue"
  diner_booth_dialogue:
    target_count: 30
    description: Monk's Cafe booth conversations and over-the-table reaction shots.
    search_queries:
      - "Seinfeld diner booth scene"
      - "Seinfeld Monk's Cafe conversation"
  hallway_or_street_walk_and_talk:
    target_count: 20
    description: Transitional hallway, sidewalk, or street walk-and-talk scenes.
    search_queries:
      - "Seinfeld hallway scene"
      - "Seinfeld street walk and talk"

clip_config:
  min_duration_s: 2.0
  max_duration_s: 8.0
  max_scenes_per_source: 25

caption:
  provider: visual_understand
  prompt_template: >-
    Write a concise training caption for this sitcom clip. Include setting,
    visible characters, camera framing, action, and mood. Do not mention source
    filenames or review labels.

filters:
  duration:
    enabled: true
    min_s: 2.0
    max_s: 8.0

review:
  enabled: true
  reject_reasons:
    - watermark
    - wrong_scene
    - wrong_character
    - bad_motion
    - low_quality
    - wrong_content
    - rights_concern
    - other

manifest:
  adapter: ai-toolkit-ltx

budgets:
  max_api_calls: 500
  max_estimated_cost_usd: 25.0
  providers:
    caption.visual_understand:
      max_calls: 250
      rate_limit_per_minute: 30
    bucket_judge.visual_understand:
      max_calls: 250
      rate_limit_per_minute: 30

output:
  run_dir: runs/seinfeld-dataset

extensions:
  bucket_judge:
    enabled: true
    provider: visual_understand
    buckets:
      - apartment_group_dialogue
      - diner_booth_dialogue
      - hallway_or_street_walk_and_talk
    prompt_template: >-
      Classify this clip into one of these configured buckets: {buckets}.
      Accept only clean sitcom footage useful for training a Seinfeld-style LTX
      LoRA. Reject commercials, interviews, watermarked uploads, title cards,
      compilations with heavy edits, and off-topic clips. Return strict JSON
      with accept, bucket, reason, and score.
