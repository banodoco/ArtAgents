schema_version: 1
trainer_id: ai-toolkit-ltx
manifest_path: runs/always-sunny-dataset/ai-toolkit-ltx.manifest.json
compute:
  backend: runpod
  gpu_type: NVIDIA RTX 6000 Ada Generation
  container_disk_gb: 200
  max_runtime_seconds: 43200
  max_gpu_hours: 12
  max_runpod_spend_usd: 15
  require_spend_confirmation: true
  storage_name: always-sunny-dataset
  image: ostris/aitoolkit:latest
  ports: 8675/http,22/tcp
secrets:
  required_env:
    - RUNPOD_API_KEY
    - HF_TOKEN
base_model: Lightricks/LTX-2.3/ltx-2.3-22b-dev.safetensors
lora_config:
  lora_id: always-sunny-chaos-v1
  trigger_word: paddy chaos scene
  prompt_text: chaotic ensemble bar comedy scene with handheld-feeling blocking, fast selfish argument, and dingy practical lighting.
  rank: 32
  alpha: 32
  steps: 2000
  learning_rate: 0.00002
  seed: 43
  width: 512
  height: 768
  num_frames: 121
  fps: 24
  batch_size: 1
  gradient_accumulation_steps: 4
  save_every: 250
  sample_every: 250
checkpoint:
  enabled: true
  sample_prompts:
    - paddy chaos scene, a tense bar argument around a terrible business idea
    - paddy chaos scene, a cramped back-office argument with selfish escalation
  review_labels:
    - ensemble argument
    - grimy bar staging
    - caption alignment
    - motion stability
output:
  run_dir: runs/always-sunny-lora
