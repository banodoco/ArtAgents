schema_version: 2
id: text_review
name: Text Review
version: 0.1.0
status: active
visibility: hidden
description: A text review pipeline that auto-generates a machine summary (line/word/char counts plus preview) and then asks an agent to attest a human-readable verdict.
documentation:
  kind: agents
  path: AGENTS.md
content:
  executors: executors
agent:
  purpose: "Use when the summary step should be fully automated by code (not agent-attested) and only the final verdict requires human/agent judgment in an attested step."
permissions:
  - id: subprocess
    reason: Runs text review pipeline executors as subprocesses.
  - id: project_files
    reason: Reads text files for review and writes summary and verdict outputs.
