schema_version: 2
id: text_digest
name: Text Digest
version: 0.1.0
status: active
visibility: hidden
description: Multi-orchestrator pack for digesting text files through attested agent-in-the-loop pipelines that read, summarize, and deliver verdicts.
documentation:
  kind: agents
  path: AGENTS.md
agent:
  purpose: "Use when you want an agent to read and attest a structured JSON summary of a text file (line count, word count, notes) before returning a final verdict."
permissions:
  - id: subprocess
    reason: Runs text digest pipeline executors as subprocesses.
  - id: project_files
    reason: Reads text files and writes digest outputs.
