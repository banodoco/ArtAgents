schema_version: 2
id: media
name: Media Production Pack
version: 0.1.0
status: active
description: A realistic media production pack for video trailer creation with AI-assisted workflows.

content:
  executors: executors
  orchestrators: orchestrators
  elements: elements
  schemas: schemas
  examples: examples

agent:
  purpose: Provides AI-assisted media production capabilities including asset ingestion, trailer orchestration, and Remotion visual effects.
  normal_entrypoints:
    - ingest_assets
    - make_trailer
  do_not_use_for: |
    This pack is for media production pipelines only. Do not use for general computation,
    data processing, or tasks unrelated to video/asset production.
keywords:
  - media
  - video
  - trailer
  - remotion
  - ai

capabilities:
  - asset_ingestion
  - trailer_generation
  - visual_effects

documentation:
  kind: agents
  path: AGENTS.md
permissions:
  - id: subprocess
    reason: Runs ffmpeg and media production executors.
  - id: network
    reason: Calls OpenAI and Unsplash APIs for AI-assisted media generation.
  - id: project_files
    reason: Reads and writes media assets and production artifacts.
  - id: environment
    reason: Reads OPENAI_API_KEY and UNSPLASH_ACCESS_KEY.
