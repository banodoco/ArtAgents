schema_version: 2
id: file_summarizer
name: File Summarizer
version: 0.1.0
status: active
visibility: hidden
description: Pipelines for reading text files, producing attested JSON summaries with word/line/char counts and notes, and emitting a verdict.
documentation:
  kind: agents
  path: AGENTS.md
content:
  executors: executors
agent:
  purpose: "Use when you need to ingest a text file and produce a structured, agent-attested summary with counts and a final verdict through a multi-step pipeline."
permissions:
  - id: subprocess
    reason: Runs file summarizer pipeline executors as subprocesses.
  - id: project_files
    reason: Reads text files and writes JSON summary outputs.
