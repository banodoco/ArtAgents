schema_version: 2
id: minimal
name: Minimal Example Pack
version: 0.1.0
description: A minimal strict-v2 external pack fixture for install and validation tests.
capabilities: [minimal]
content:
  executors: executors
  orchestrators: orchestrators
  elements: elements
documentation:
  kind: agents
  path: AGENTS.md
agent:
  purpose: Demonstrates the minimal structure required for a valid external pack.
  normal_entrypoints:
    - validate
    - install
permissions:
  - id: subprocess
    reason: Runs example executor and orchestrator subprocesses.
  - id: project_files
    reason: Reads and validates project assets.
