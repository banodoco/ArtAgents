schema_version: 2
id: minimal
name: Minimal Example Pack
version: 0.1.0
description: A minimal external pack fixture for discovery and validation tests.

capabilities: [minimal]

content:
  executors: executors
  orchestrators: orchestrators
  elements: elements

agent:
  purpose: Demonstrates the minimal structure required for a valid external pack.
  normal_entrypoints:
    - validate
documentation:
  kind: agents
  path: AGENTS.md
permissions:
  - id: subprocess
    reason: Runs example executor and orchestrator subprocesses.
  - id: project_files
    reason: Reads and validates project assets.
