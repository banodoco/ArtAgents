# Capability Artifact Waist — megaplan epic (canonical, tracked, runnable).
# Design narrative: docs/RFC-capability-artifact-waist.md + docs/migration/capability-waist/MIGRATION-PLAN.md
#
# *** LAYERS ON the in-flight RESTRUCTURE-PLAN.md effort (executing as the `beauty-v2` commits). ***
# RESTRUCTURE fixes WHERE code lives (import graph -> 8 tiers, contracts-leaf, foundation/_shared,
# a core/registry/ base + execution/ umbrella). This epic adds HOW things compose (artifact-type
# waist + scoped-config). RESTRUCTURE is the prerequisite substrate.
#
# DO NOT START until RESTRUCTURE has landed W1 (foundation/_shared/contracts-leaf) and W7
# (core/registry/ + execution/) AND its beauty-v2 worker has STOPPED (serialize — one wave at a
# time). Then rebase base_branch onto that and run. S0's import-graph leg is satisfied by CY1-CY5.
#
# FULLY AUTONOMOUS — no human-in-the-loop: every milestone gate is an objective test/oracle; no
# review/decision steps; --no-prep-clarify (prep never halts asking); auto merge-policy (no manual
# merges); no --with-feedback. A milestone meets its gate or fails the chain; /babysit unblocks stalls.
#
# Run (later) with:
#   megaplan chain start --spec docs/migration/capability-waist/chain.yaml --in-worktree capability-waist --no-prep-clarify
# inside a subagent, then /babysit to completion; land via PR.
base_branch: astrid-capability-waist   # RESTRUCTURE landed here (cycles 24->6); epic layers on top

defaults:
  vendor: claude
  profile: solo
  robustness: full

milestones:
  - label: s0-derisk-spike
    idea: docs/migration/capability-waist/briefs/s0-derisk-spike.md
    profile: partnered
    robustness: light
    depth: high
    notes: "SLIMMED (import-graph leg removed — RESTRUCTURE/CY1-CY5 did it). Prove the scoped-config primitive on ONE theme seam without breaking subprocess parity; capture the Reigh round-trip baseline that gates the epic. If scoped-config can't be made clean, STOP and re-plan S3."

  - label: s1-waist-and-timeline-proof
    idea: docs/migration/capability-waist/briefs/s1-waist-and-timeline-proof.md
    profile: directed
    depth: medium
    depends_on: s0-derisk-spike
    notes: "Vertical proof slice on the POST-RESTRUCTURE tree: artifact_type field + ArtifactTypeRegistry, annotate element/clip I/O, rewire timeline validator to type-checked id-resolution behind a PARITY ORACLE. Preserve open-string opaque fallback (Reigh)."

  - label: s2-waist-rollout
    idea: docs/migration/capability-waist/briefs/s2-waist-rollout.md
    profile: solo
    depends_on: s1-waist-and-timeline-proof
    notes: "Mechanical replication: annotate remaining exec/orch/model I/O; orchestrator child_* -> type-validated refs; model param_map -> adapters; fal.py model-name hardcodes -> adapter hints. Per-seam parity."

  - label: s3-scoped-config-themes
    idea: docs/migration/capability-waist/briefs/s3-scoped-config-themes.md
    profile: partnered
    depth: high
    depends_on: s1-waist-and-timeline-proof
    notes: "De-risked by s0. Scoped-config primitive; reimplement theme on it; kill _ACTIVE_THEME_DIR + HYPE_ACTIVE_THEME threading; theme.json -> style_config scoped artifact; fold secrets in. Parity oracle on theme resolution."

  - label: s4-capabilities-on-kernel-and-purge
    idea: docs/migration/capability-waist/briefs/s4-capabilities-on-kernel-and-purge.md
    profile: partnered
    depth: high
    depends_on: [s2-waist-rollout, s3-scoped-config-themes]
    notes: "SLIMMED — RESTRUCTURE built core/registry/ + execution/. PUT capabilities on that base: kind becomes a tag; migrate 12 elements to capability form (runtime adapter; component.tsx non-required); dedup text-card to kernel override; PURGE element fork/install/override/dirty/update + tests. REQUIRES RESTRUCTURE W7. Parity oracle: SDK discovery identical."

  - label: s5-example-and-docs
    idea: docs/migration/capability-waist/briefs/s5-example-and-docs.md
    profile: solo
    robustness: light
    depth: low
    depends_on: s4-capabilities-on-kernel-and-purge
    notes: "Worked example (fal model + Remotion element, same contract) in docs/examples/capability-contract/; guide in docs/contracts/; update docs/templates/element/. Example validates against the real registry."
