# Megaplan Cloud runner for the astrid-sisypy epic.
#
# Shared-dev-box pattern: same Railway service as other Astrid chains, with a
# distinct `chain_session` + `workspace` prefix so this chain doesn't collide
# with concurrent chains on the same primary repo.
#
# Launch with:
#   megaplan cloud deploy --cloud-yaml docs/megaplan/epics/astrid-sisypy/cloud.yaml
#   megaplan cloud chain  --cloud-yaml docs/megaplan/epics/astrid-sisypy/cloud.yaml \
#     docs/megaplan/epics/astrid-sisypy/chain.yaml

provider: railway

repo:
  url: https://github.com/peteromallet/Astrid.git
  branch: main
  workspace: /workspace/astrid-sisypy/astrid   # distinct prefix; avoids collision

agents:
  default: codex

codex:
  model: gpt-5.5
  reasoning: medium

mode: idle

chain_session: astrid-sisypy

megaplan:
  ref: main
  # Install current megaplan from source at `ref` on every boot + before each chain
  # run (arnold cloud fix d1d677ce). Replaces the stale-PyPI default + the old
  # MEGAPLAN_INSTALL_SPEC=/workspace/arnold env hack (now unset on the service).
  repo: https://github.com/peteromallet/arnold.git

resources:
  volume: astrid-git-backed-packs-megaplan
  port: 8080

railway:
  project: reigh-megaplan-dev
  service: astrid-git-backed-packs
  session: astrid-sisypy-attach

toolchains:
  - name: astrid-video-tools
    install: |
      RUN apt-get update \
        && apt-get install -y --no-install-recommends ffmpeg unzip \
        && rm -rf /var/lib/apt/lists/*
  - name: shannon-runtime
    install: |
      RUN . "$NVM_DIR/nvm.sh" \
        && npm install -g @dexh/shannon@0.0.2 \
        && NVBIN=$(ls -d /root/.nvm/versions/node/*/bin | head -1) \
        && ln -sf "$NVBIN/shannon" /usr/local/bin/shannon
      RUN curl -fsSL https://bun.sh/install | bash \
        && ln -sf /root/.bun/bin/bun /usr/local/bin/bun \
        && bun --version

secrets:
  # All keys (OPENAI_API_KEY for codex, ANTHROPIC_API_KEY, DEEPSEEK_API_KEY,
  # FIREWORKS_API_KEY, GITHUB_TOKEN, CLAUDE_CODE_OAUTH_TOKEN) are ALREADY set on
  # the shared service from prior deploys. Empty list so deploy does not
  # overwrite them with blanks (megaplan-cloud gotcha #5).
  []
