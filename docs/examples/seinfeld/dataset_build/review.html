<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dataset Review</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#f4f4f4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
button,select,textarea{font:inherit}
#topbar{position:sticky;top:0;z-index:5;background:#0b0b0bf2;border-bottom:1px solid #242424;backdrop-filter:blur(12px)}
#topbar-inner{max-width:1180px;margin:0 auto;padding:12px 16px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
#filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#filters button,#submit{border:1px solid #353535;background:#151515;color:#a8a8a8;border-radius:6px;padding:7px 12px;cursor:pointer}
#filters button:hover,#submit:hover{background:#1e1e1e;color:#fff}
#filters button.active{background:#e8e2ce;color:#151515;border-color:#e8e2ce}
#counts{font-size:12px;color:#8f8f8f;justify-self:end;white-space:nowrap}
#submit{background:#1f3b2b;border-color:#366447;color:#d8ffe4}
#status{max-width:1180px;margin:0 auto;padding:0 16px 10px;color:#8f8f8f;font-size:12px}
#list{max-width:1180px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.empty{padding:48px 16px;text-align:center;color:#888;border:1px dashed #333;border-radius:8px}
.card{display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:14px;background:#121212;border:1px solid #252525;border-radius:8px;padding:12px}
.card.accept{border-color:#29553a;background:#101a13}
.card.reject{border-color:#5e2d2d;background:#1a1010}
.media{display:flex;flex-direction:column;gap:8px;min-width:0}
video{width:100%;aspect-ratio:16/9;object-fit:contain;background:#000;border-radius:6px;border:1px solid #202020}
.meta{display:flex;gap:8px;flex-wrap:wrap;color:#858585;font-size:12px;line-height:1.35}
.main{min-width:0;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.id{font-weight:650;color:#f1f1f1;overflow-wrap:anywhere}
.pill{font-size:12px;border:1px solid #363636;border-radius:999px;padding:3px 8px;color:#aaa;background:#171717}
.pill.pending{color:#e8e2ce;border-color:#695f3b}
.pill.accept{color:#8ff0a4;border-color:#386846}
.pill.reject{color:#ff9a9a;border-color:#733838}
.caption{width:100%;min-height:72px;resize:vertical;background:#0b0b0b;color:#e8e8e8;border:1px solid #303030;border-radius:6px;padding:9px 10px;line-height:1.35}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.actions button{border:1px solid #383838;background:#181818;color:#ddd;border-radius:6px;padding:8px 11px;cursor:pointer}
.actions button:hover{background:#242424}
.actions button.yes{border-color:#3f704a;color:#a7f3b4}
.actions button.no{border-color:#7a3b3b;color:#ffabab}
.actions button.clear{color:#aaa}
.actions button.selected.yes{background:#21462a;color:#dcffe3}
.actions button.selected.no{background:#4a2020;color:#ffe1e1}
.reason{background:#111;color:#ddd;border:1px solid #353535;border-radius:6px;padding:8px;min-width:150px}
@media(max-width:760px){
  #topbar-inner{grid-template-columns:1fr}
  #counts{justify-self:start}
  .card{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="topbar">
  <div id="topbar-inner">
    <div id="filters">
      <button data-filter="all" class="active">All</button>
      <button data-filter="pending">Pending</button>
      <button data-filter="accepted">Accepted</button>
      <button data-filter="rejected">Rejected</button>
      <button id="submit">Submit</button>
    </div>
    <div id="counts"></div>
  </div>
  <div id="status">Loading...</div>
</div>
<main id="list"></main>
<script>
const token = new URLSearchParams(location.search).get('token') || '';
const S = id => document.getElementById(id);
const REASONS = ['', 'watermark', 'wrong_scene', 'wrong_character', 'bad_motion'];
let clips = [];
let decisions = {};
let filter = 'all';
let saveTimer = null;

function headers(){ return {'X-Session-Token': token, 'Content-Type': 'application/json'}; }
function clipSrc(c){ return '/clips/' + encodeURIComponent(c.bucket) + '/' + encodeURIComponent(c.id) + '.mp4'; }
function stateOf(c){ return decisions[c.id]?.decision || 'pending'; }
function matches(c){
  const s = stateOf(c);
  return filter === 'all' || (filter === 'pending' && s === 'pending') || (filter === 'accepted' && s === 'accept') || (filter === 'rejected' && s === 'reject');
}
function counts(){
  let pending = 0, accepted = 0, rejected = 0;
  for(const c of clips){
    const s = stateOf(c);
    if(s === 'accept') accepted++;
    else if(s === 'reject') rejected++;
    else pending++;
  }
  return {pending, accepted, rejected};
}
function labelFor(s){
  if(s === 'accept') return 'Accepted';
  if(s === 'reject') return 'Rejected';
  return 'Pending';
}
function saveNow(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    fetch('/save', {method:'POST', headers:headers(), body:JSON.stringify({decisions})})
      .then(r => {
        S('status').textContent = r.ok ? 'Saved' : 'Save failed';
      })
      .catch(() => { S('status').textContent = 'Save failed'; });
  }, 200);
}
function setDecision(id, decision){
  const existing = decisions[id] || {};
  decisions[id] = {
    decision,
    reject_reason: decision === 'reject' ? (existing.reject_reason || null) : null,
    edited_caption: existing.edited_caption || null,
    reviewed_at: new Date().toISOString()
  };
  saveNow();
  render();
}
function clearDecision(id){
  delete decisions[id];
  saveNow();
  render();
}
function setReason(id, value){
  const existing = decisions[id] || {decision:'reject', reject_reason:null, edited_caption:null};
  decisions[id] = {
    decision: 'reject',
    reject_reason: value || null,
    edited_caption: existing.edited_caption || null,
    reviewed_at: new Date().toISOString()
  };
  saveNow();
  renderCounts();
  const card = document.querySelector(`[data-id="${CSS.escape(id)}"]`);
  if(card){
    card.classList.remove('accept');
    card.classList.add('reject');
    const pill = card.querySelector('.pill');
    if(pill){ pill.className = 'pill reject'; pill.textContent = 'Rejected'; }
    card.querySelector('.yes')?.classList.remove('selected');
    card.querySelector('.no')?.classList.add('selected');
  }
}
function setCaption(id, value){
  const existing = decisions[id] || {decision:'reject', reject_reason:null, edited_caption:null};
  decisions[id] = {
    decision: existing.decision || 'reject',
    reject_reason: existing.reject_reason || null,
    edited_caption: value.trim() || null,
    reviewed_at: new Date().toISOString()
  };
  saveNow();
  renderCounts();
}
function renderCounts(){
  const c = counts();
  S('counts').textContent = `${c.pending} pending · ${c.accepted} accepted · ${c.rejected} rejected · ${clips.length} total`;
}
function render(){
  renderCounts();
  for(const b of document.querySelectorAll('#filters button[data-filter]')){
    b.classList.toggle('active', b.dataset.filter === filter);
  }
  const visible = clips.filter(matches);
  const list = S('list');
  list.innerHTML = '';
  S('status').textContent = visible.length ? `${visible.length} visible` : 'No clips match this filter';
  if(!visible.length){
    list.innerHTML = '<div class="empty">No clips match this filter.</div>';
    return;
  }
  const frag = document.createDocumentFragment();
  for(const c of visible){
    const d = decisions[c.id] || {};
    const s = stateOf(c);
    const card = document.createElement('article');
    card.className = 'card ' + (s === 'accept' ? 'accept' : s === 'reject' ? 'reject' : '');
    card.dataset.id = c.id;
    const confidence = c.judge_confidence != null ? Math.round(c.judge_confidence * 100) + '% confidence' : 'unscored';
    const duration = c.duration_s != null ? Number(c.duration_s).toFixed(1) + 's' : '';
    card.innerHTML = `
      <div class="media">
        <video controls preload="metadata" src="${clipSrc(c)}"></video>
        <div class="meta">
          <span>${c.source_title || c.source_slug || c.bucket || ''}</span>
          <span>${duration}</span>
          <span>${confidence}</span>
        </div>
      </div>
      <div class="main">
        <div class="row">
          <span class="id">${c.id}</span>
          <span class="pill ${s === 'accept' ? 'accept' : s === 'reject' ? 'reject' : 'pending'}">${labelFor(s)}</span>
        </div>
        <textarea class="caption" aria-label="Caption">${d.edited_caption || c.caption || ''}</textarea>
        <div class="actions">
          <button class="yes ${s === 'accept' ? 'selected' : ''}" type="button">Yes</button>
          <button class="no ${s === 'reject' ? 'selected' : ''}" type="button">No</button>
          <select class="reason" aria-label="Reject reason">
            ${REASONS.map(r => `<option value="${r}" ${d.reject_reason === r ? 'selected' : ''}>${r || 'No reason'}</option>`).join('')}
          </select>
          <button class="clear" type="button">Pending</button>
        </div>
      </div>`;
    card.querySelector('.yes').addEventListener('click', () => setDecision(c.id, 'accept'));
    card.querySelector('.no').addEventListener('click', () => setDecision(c.id, 'reject'));
    card.querySelector('.clear').addEventListener('click', () => clearDecision(c.id));
    card.querySelector('.reason').addEventListener('change', e => setReason(c.id, e.target.value));
    card.querySelector('.caption').addEventListener('input', e => setCaption(c.id, e.target.value));
    frag.appendChild(card);
  }
  list.appendChild(frag);
}
async function submitAll(){
  const c = counts();
  if(c.pending && !confirm(c.pending + ' clips are still pending. Submit anyway?')) return;
  for(const clip of clips){
    if(!decisions[clip.id]){
      decisions[clip.id] = {decision:'reject', reject_reason:null, edited_caption:null, reviewed_at:new Date().toISOString()};
    }
  }
  const body = {decisions, completed_at: new Date().toISOString()};
  const r = await fetch('/submit', {method:'POST', headers:headers(), body:JSON.stringify(body)});
  if(r.ok){
    S('status').textContent = 'Submitted';
    document.body.insertAdjacentHTML('beforeend','<div style="position:fixed;right:16px;bottom:16px;background:#163a22;color:#dcffe3;border:1px solid #3b7a4d;border-radius:8px;padding:12px 14px">Review submitted</div>');
  }else{
    const e = await r.json().catch(() => ({}));
    alert('Submit failed: ' + (e.detail || e.error || r.status));
  }
}
async function init(){
  const data = await fetch('/data.json').then(r => r.json());
  clips = data.clips || data;
  try{
    const r = await fetch('/state.json?token=' + token);
    if(r.ok){
      const state = await r.json();
      decisions = state.decisions || {};
    }
  }catch(e){}
  for(const b of document.querySelectorAll('#filters button[data-filter]')){
    b.addEventListener('click', () => { filter = b.dataset.filter; render(); });
  }
  S('submit').addEventListener('click', submitAll);
  render();
}
init();
</script>
</body>
</html>
