schema_version: 2
id: reigh
name: Astrid Reigh
version: 1.0.0
domain: integration
stability: stable
support: core
visibility: visible
permissions:
  - id: subprocess
    reason: Runs Reigh integration executors as subprocesses.
  - id: project_files
    reason: Reads timeline and asset files for handoff into Reigh projects.
  - id: network
    reason: Publishes timelines and assets to Reigh API.
  - id: environment
    reason: Reads REIGH_USER_TOKEN and REIGH_SUPABASE_URL.
description: Reigh platform integration — publish timelines/assets into Reigh projects, fetch project data, and build spatial-audio handoff pages.
keywords:
- reigh
- publish
- timeline
- assets
- project
- handoff
- spatial-audio
- edge-function
capabilities:
- publish_timeline
- open_in_reigh
- fetch_reigh_data
- build_spatial_audio_page
agent:
  purpose: Choose this pack when you need to hand off Astrid-generated timelines and assets to the Reigh platform — publishing them into a Reigh project, fetching canonical project data, or building a spatial-audio preview page.
  do_not_use_for: Not for creating timelines/assets or rendering MP4s; use video_editing and rendering before handoff.
  normal_entrypoints:
  - reigh.publish
  - reigh.reigh_data
content:
  executors: executors
documentation:
  kind: skill
  path: skill/SKILL.md
