schema_version: 1
id: reigh
name: Astrid Reigh
version: 1.0.0
origin: builtin
install_tier: core
pack_type: capability
domain: integration
stability: stable
support: core
visibility: visible
permissions:
  - id: subprocess
    reason: Runs Reigh integration executors as subprocesses.
  - id: project_files
    reason: Reads timeline and asset files for handoff into Reigh projects.
  - id: network
    reason: Publishes timelines and assets to Reigh API.
  - id: environment
    reason: Reads REIGH_USER_TOKEN and REIGH_SUPABASE_URL.
description: Reigh platform integration — publish timelines/assets into Reigh projects, fetch project data, and build spatial-audio handoff pages.
keywords:
- reigh
- publish
- timeline
- assets
- project
- handoff
- spatial-audio
- edge-function
capabilities:
- publish_timeline
- open_in_reigh
- fetch_reigh_data
- build_spatial_audio_page
agent:
  purpose: Choose this pack when you need to hand off Astrid-generated timelines and assets to the Reigh platform — publishing them into a Reigh project, fetching canonical project data, or building a spatial-audio preview page.
  do_not_use_for: Not for rendering or producing the timeline/video itself; use the rendering pack to generate output before publishing here.
  normal_entrypoints:
  - reigh.publish
  - reigh.reigh_data
content:
  executors: executors
aliases:
- kind: executor
  alias: builtin.reigh_data
  canonical_id: reigh.reigh_data
  deprecated: true
  deprecation_message: Moved to reigh.reigh_data
- kind: executor
  alias: builtin.open_in_reigh
  canonical_id: reigh.open_in_reigh
  deprecated: true
  deprecation_message: Moved to reigh.open_in_reigh
- kind: executor
  alias: builtin.spatial_audio_page
  canonical_id: reigh.spatial_audio_page
  deprecated: true
  deprecation_message: Moved to reigh.spatial_audio_page
- kind: executor
  alias: builtin.publish
  canonical_id: reigh.publish
  deprecated: true
  deprecation_message: Moved to reigh.publish
