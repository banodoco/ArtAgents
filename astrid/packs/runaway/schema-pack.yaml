# Astrid runaway schema pack (typed Runaway timing).
#
# This is a schema-pack manifest, NOT a capability pack.yaml: it carries
# exactly the 11 snake_case top-level fields of the frozen schema-pack
# contract and is validated by astrid.core.schema_packs.manifest.
#
# The runaway pack owns exactly one table (runaway_transitions) and declares
# the runaway vocabulary: the receipt-backed create command and repository.
# The table FK-integrates with the kernel run table (runs.id RESTRICT,
# projects.id CASCADE, tasks.id SET NULL) and handles sharding: runs with
# >256 transitions use continue_run with globally contiguous ordinals,
# storing run_id per shard. The repository is kernel-writer backed and owns
# one transition-set event stream per run, emitting one hash-chained pack
# event per admitted batch before recording the shared command receipt.
id: runaway
version: 1
depends_on:
  - core >= 1
migrations:
  - version: 1
    name: initial
    path: migrations/0001_initial.sql
    tables:
      - runaway_transitions
stream_types:
  - runaway.transition_set
event_kinds:
  - runaway.created
command_kinds:
  - runaway.create
repositories:
  - RunawayRepository
conformance:
  - writer_ownership
  - crash_atomicity
cli_mounts: {}
bridge_mounts:
  - runaway_transitions
