schema_version: 1
id: training
name: Astrid Training
version: 1.0.0
origin: builtin
install_tier: core
pack_type: capability
domain: development
stability: stable
support: core
visibility: visible
permissions:
  - id: subprocess
    reason: Runs training dataset and pool executors as subprocesses.
  - id: project_files
    reason: Reads and writes candidate pools, datasets, and training artifacts.
  - id: network
    reason: Training run orchestrator provisions RunPod GPUs and downloads checkpoints.
  - id: environment
    reason: Reads RunPod API credentials for GPU provisioning.
description: Build video training datasets and run LoRA training end to end — clip pools, captioning/review, RunPod-backed trainer execution, and checkpoint registration.
keywords:
- training
- lora
- dataset
- captioning
- runpod
- checkpoint
- pool
- huggingface
capabilities:
- build_dataset
- run_training
- build_clip_pool
- merge_clip_pool
- search_loras
- manage_asset_cache
agent:
  purpose: Choose this pack to assemble a video training dataset (acquire, split, caption, review) or to run a LoRA training job that provisions GPUs, executes the trainer remotely, pulls checkpoints, and registers artifacts.
  do_not_use_for: Not for raw GPU provisioning or one-off remote script execution on its own; use the runpod pack for bare pod lifecycle control.
  normal_entrypoints:
  - training.training_run
  - training.dataset_build
content:
  executors: executors
  orchestrators: orchestrators
aliases:
- kind: executor
  alias: builtin.pool_build
  canonical_id: training.pool_build
  deprecated: true
  deprecation_message: Moved to training.pool_build
- kind: executor
  alias: builtin.pool_merge
  canonical_id: training.pool_merge
  deprecated: true
  deprecation_message: Moved to training.pool_merge
- kind: executor
  alias: builtin.search_loras
  canonical_id: training.search_loras
  deprecated: true
  deprecation_message: Moved to training.search_loras
- kind: executor
  alias: builtin.asset_cache
  canonical_id: training.asset_cache
  deprecated: true
  deprecation_message: Moved to training.asset_cache
- kind: orchestrator
  alias: builtin.training_run
  canonical_id: training.training_run
  deprecated: true
  deprecation_message: Moved to training.training_run
- kind: orchestrator
  alias: builtin.dataset_build
  canonical_id: training.dataset_build
  deprecated: true
  deprecation_message: Moved to training.dataset_build
