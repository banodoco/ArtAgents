{
  "schema_version": 1,
  "id": "training.dataset_build",
  "name": "Dataset Build",
  "kind": "built_in",
  "version": "0.1.0",
  "short_description": "Build a generic reviewed video training dataset from configured sources.",
  "description": "Coordinates source acquisition, scene splitting, filtering, captioning, human review, and manifest export for generic built-in video training datasets.",
  "keywords": [
    "dataset",
    "training",
    "video",
    "captioning",
    "review",
    "manifest"
  ],
  "inputs": [
    {
      "name": "config",
      "type": "path",
      "required": true,
      "description": "Dataset build config JSON or YAML."
    },
    {
      "name": "out",
      "type": "path",
      "required": true,
      "description": "Run output directory."
    }
  ],
  "outputs": [
    {
      "name": "final.manifest.json",
      "type": "json",
      "mode": "create_or_replace",
      "path_template": "{out}/final.manifest.json",
      "description": "Canonical manifest containing accepted dataset clips."
    },
    {
      "name": "ai_toolkit_ltx_manifest",
      "type": "json",
      "mode": "create_or_replace",
      "path_template": "{out}/manifests/ai-toolkit-ltx/manifest.json",
      "description": "Adapter manifest for ai-toolkit LTX training."
    },
    {
      "name": "quality_report.json",
      "type": "json",
      "mode": "create_or_replace",
      "path_template": "{out}/quality_report.json",
      "description": "Dataset quality report with filter, caption-validation, budget, and shortfall observations."
    }
  ],
  "runtime": {
    "kind": "command",
    "command": {
      "argv": [
        "{python_exec}",
        "-m",
        "astrid.packs.training.orchestrators.dataset_build.run",
        "{orchestrator_args}"
      ]
    }
  },
  "child_executors": [
    "youtube.youtube_audio",
    "editorial.scenes",
    "editorial.transcribe",
    "understanding.visual_understand",
    "understanding.video_understand",
    "editorial.human_review"
  ],
  "child_orchestrators": [],
  "cache": {
    "mode": "none"
  },
  "metadata": {
    "runtime_module": "astrid.packs.training.orchestrators.dataset_build.run",
    "runtime_file": "run.py",
    "runtime_entrypoint": "main",
    "package_paths": {
      "source_providers": "source_providers/",
      "caption_providers": "caption_providers/",
      "filter_stages": "filter_stages/",
      "manifest_adapters": "manifest_adapters/",
      "review_ui": "review_ui/",
      "schemas": "schemas/"
    }
  }
}
