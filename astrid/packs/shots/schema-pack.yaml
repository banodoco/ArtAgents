# Astrid shots schema pack (v10 section 2; decision artifact section 4).
#
# This is a schema-pack manifest, NOT a capability pack.yaml: it carries
# exactly the 11 snake_case top-level fields of the frozen schema-pack
# contract and is validated by astrid.core.schema_packs.manifest.
#
# The shots pack owns exactly three tables (shots, shot_items,
# shot_text_bindings) and declares the
# m3 namespaced shot vocabulary: the pack-owned aggregate stream type
# ``shot.shot`` (one stream per shot, registered so events can identify shot
# subjects without adding pack vocabulary to kernel DDL), the receipt-backed
# create/add/remove/reorder commands and events, and the executable
# ``ShotRepository`` (kernel-writer backed). The declared names are
# registry-validated before any mutation, and the kernel aggregate rule table
# (astrid.core.events.registry.STREAM_AGGREGATE_RULES) owns the shot
# aggregate semantics.
id: shots
version: 2
depends_on:
  - core >= 1
migrations:
  - version: 1
    name: initial
    path: migrations/0001_initial.sql
    tables:
      - shots
      - shot_items
  - version: 2
    name: text_bindings
    path: migrations/0002_text_bindings.sql
    tables:
      - shot_text_bindings
stream_types:
  - shot.shot
  - shot.text_binding
event_kinds:
  - shot.created
  - shot.item_added
  - shot.item_removed
  - shot.reordered
  - shot.candidate_promoted
  - shot.text_binding.created
  - shot.text_binding.rebound
command_kinds:
  - shot.create
  - shot.add_item
  - shot.remove_item
  - shot.reorder
  - shot.promote_candidate
  - shot.text_binding.set
  - shot.text_binding.rebind
  - shot.text_binding.apply
repositories:
  - ShotRepository
  - ShotTextBindingRepository
conformance:
  - replay
  - mismatch_before_mutation
  - same_project
  - vocabulary
  - writer_ownership
  - crash_atomicity
  - hash_chain
  - text_binding_identity
  - text_binding_cas
  - text_binding_checkout
cli_mounts:
  shots: timelines shots
  text: timelines text
bridge_mounts: []
