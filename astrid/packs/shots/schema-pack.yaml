# Astrid shots schema pack (v10 section 2; decision artifact section 4).
#
# This is a schema-pack manifest, NOT a capability pack.yaml: it carries
# exactly the 11 snake_case top-level fields of the frozen schema-pack
# contract and is validated by astrid.core.schema_packs.manifest.
#
# The shots pack owns exactly two tables (shots, shot_items) and declares the
# future namespaced shot vocabulary. No executable repositories ship in m1
# (repositories is empty); the declared event/command kinds are the normative
# v10 examples and are registry-validated before any mutation.
id: shots
version: 1
depends_on:
  - core >= 1
migrations:
  - version: 1
    name: initial
    path: migrations/0001_initial.sql
    tables:
      - shots
      - shot_items
stream_types: []
event_kinds:
  - shot.item_added
command_kinds:
  - shot.add_item
repositories: []
conformance:
  - replay
  - mismatch_before_mutation
  - same_project
  - vocabulary
  - writer_ownership
  - crash_atomicity
cli_mounts:
  shots: timelines shots
bridge_mounts: []
