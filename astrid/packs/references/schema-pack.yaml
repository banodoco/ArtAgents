# Astrid references schema pack (v10 section 2; decision artifact section 4).
#
# This is a schema-pack manifest, NOT a capability pack.yaml: it carries
# exactly the 11 snake_case top-level fields of the frozen schema-pack
# contract and is validated by astrid.core.schema_packs.manifest.
#
# The references pack owns exactly three tables (project_references,
# media_references, reference_links) and declares the m3 namespaced
# reference vocabulary: the pack-owned aggregate stream type
# ``reference.reference`` (one stream per reference, registered so events can
# identify reference subjects without adding pack vocabulary to kernel DDL),
# the receipt-backed lifecycle/media/link commands and events, and the
# executable ``ReferenceRepository`` (kernel-writer backed). The declared
# names are registry-validated before any mutation, and the kernel aggregate
# rule table (astrid.core.events.registry.STREAM_AGGREGATE_RULES) owns the
# reference aggregate semantics.
id: references
version: 1
depends_on:
  - core >= 1
migrations:
  - version: 1
    name: initial
    path: migrations/0001_initial.sql
    tables:
      - project_references
      - media_references
      - reference_links
stream_types:
  - reference.reference
event_kinds:
  - reference.created
  - reference.archived
  - reference.media_associated
  - reference.primary_changed
  - reference.linked
command_kinds:
  - reference.create
  - reference.archive
  - reference.associate
  - reference.set_primary
  - reference.link
repositories:
  - ReferenceRepository
conformance:
  - replay
  - mismatch_before_mutation
  - same_project
  - vocabulary
  - writer_ownership
  - crash_atomicity
  - hash_chain
cli_mounts:
  references: media references
bridge_mounts: []
