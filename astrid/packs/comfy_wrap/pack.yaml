schema_version: 2
id: comfy_wrap
name: Comfy Workflow Wrapper
version: 0.1.0
status: active
domain: generation
stability: experimental
support: core
visibility: visible
permissions:
  - id: subprocess
    reason: Runs ComfyUI via vibecomfy for image generation.
  - id: network
    reason: May download models during ComfyUI execution.
  - id: project_files
    reason: Reads workflow JSON files and writes generated outputs.
  - id: accelerator
    reason: May use GPU for ComfyUI model inference.
description: Wrap a parameterized ComfyUI workflow JSON and generate images from a text prompt via vibecomfy.
keywords:
  - comfyui
  - vibecomfy
  - workflow
  - generate
  - image
  - prompt
capabilities:
  - run_workflow
agent:
  purpose: Choose this pack to generate an image from a text prompt using a pre-built ComfyUI workflow JSON template.
  do_not_use_for: Do not use for arbitrary model selection or multi-modal generation — use generation.generate_image for the standard happy path.
  normal_entrypoints:
    - comfy_wrap.run
content:
  executors: executors
documentation:
  kind: skill
  path: skill/SKILL.md
