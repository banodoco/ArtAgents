{
  "schema_version": 1,
  "id": "stream_content.segment_map",
  "name": "Stream Segment Map",
  "kind": "built_in",
  "version": "1.0",
  "short_description": "Fuse OCR, transcript density, and scene cuts into a complete stream timeline.",
  "description": "Map a long stream or event recording into holding, dead-air, content, and screening spans with labels and confidence.",
  "keywords": ["stream", "segments", "timeline", "ocr", "transcript", "scenes"],
  "inputs": [
    {"name": "video", "type": "file", "required": true, "description": "Source stream recording."},
    {"name": "transcript", "type": "file", "required": false, "description": "Whisper transcript.json from editorial.transcribe."},
    {"name": "scenes", "type": "file", "required": false, "description": "Scene list JSON from editorial.scenes."}
  ],
  "outputs": [
    {"name": "segment_map", "type": "file", "path_template": "{out}/segment_map.json", "description": "Complete labeled timeline."}
  ],
  "command": {
    "argv": [
      "{python_exec}",
      "-m",
      "astrid.packs.stream_content.executors.segment_map.run",
      "--video",
      "{video}",
      "--out",
      "{out}/segment_map.json"
    ],
    "input_args": [
      {"input": "transcript", "flag": "--transcript", "optional": true},
      {"input": "scenes", "flag": "--scenes", "optional": true}
    ]
  },
  "cache": {"mode": "none"},
  "isolation": {
    "mode": "subprocess",
    "network": false,
    "binaries": ["ffmpeg", "ffprobe", "tesseract"]
  },
  "metadata": {
    "runtime_entrypoint": "main",
    "runtime_file": "run.py",
    "runtime_module": "astrid.packs.stream_content.executors.segment_map.run"
  }
}

