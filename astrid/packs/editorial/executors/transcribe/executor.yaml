{
  "schema_version": 1,
  "cache": {
    "always_run": false,
    "mode": "sentinel",
    "per_brief": false,
    "sentinels": [
      "transcript.json"
    ]
  },
  "clip_kinds_supported": [
    "video",
    "audio"
  ],
  "conditions": [
    {
      "input": "audio",
      "kind": "requires_input"
    }
  ],
  "description": "Transcribe source audio into transcript.json.",
  "graph": {
    "consumes": [],
    "depends_on": [],
    "provides": [
      "transcript"
    ]
  },
  "id": "editorial.transcribe",
  "inputs": [
    {
      "description": "Audio or video-derived audio to transcribe.",
      "name": "audio",
      "required": true,
      "type": "file",
      "artifact_type": "audio"
    },
    {
      "description": "Optional environment file for API credentials.",
      "name": "env_file",
      "required": false,
      "type": "file"
    }
  ],
  "isolation": {
    "binaries": [],
    "mode": "subprocess",
    "network": true,
    "requirements": []
  },
  "keywords": [
    "whisper",
    "audio",
    "transcribe",
    "text",
    "speech",
    "transcript"
  ],
  "kind": "built_in",
  "metadata": {
    "env": ["OPENAI_API_KEY"],
    "output_result_manifest": true,
    "required_permissions": ["network", "environment"],
    "secrets_required": ["OPENAI_API_KEY"],
    "command_builder": "astrid.packs.video_editing.orchestrators.hype.run.build_pool_steps",
    "pipeline_step": "transcribe",
    "pipeline_step_order": 0,
    "runtime_entrypoint": "main",
    "runtime_file": "run.py",
    "runtime_module": "astrid.packs.editorial.executors.transcribe.run",
    "network_policy": {"allowed_protocols":["dns","tcp"],"allowed_destinations":["api.openai.com:443"],"allow_redirects":false}},
  "name": "Transcribe",
  "outputs": [
    {
      "description": "",
      "mode": "create_or_replace",
      "name": "transcript",
      "path_template": "{out}/transcript.json",
      "type": "file",
      "artifact_type": "transcript"
    },
    {
      "description": "Subtitle transcript with segment timestamps.",
      "mode": "create_or_replace",
      "name": "subtitle",
      "path_template": "{out}/transcript.srt",
      "type": "file",
      "artifact_type": "subtitle"
    },
    {
      "description": "Plain-text transcript.",
      "mode": "create_or_replace",
      "name": "transcript_text",
      "path_template": "{out}/transcript.txt",
      "type": "file",
      "artifact_type": "transcript/text"
    },
    {
      "description": "Chunk and silence-analysis metadata.",
      "mode": "create_or_replace",
      "name": "chunk_plan",
      "path_template": "{out}/cache/chunks.json",
      "type": "file",
      "artifact_type": "metadata/transcript-chunks"
    },
    {
      "description": "Universal result manifest.",
      "mode": "create_or_replace",
      "name": "manifest",
      "path_template": "{out}/manifest.json",
      "type": "file",
      "artifact_type": "metadata/result-manifest"
    }
  ],
  "pipeline_requirements": [
    "source_audio"
  ],
  "scoped_configs": ["credentials.openai"],
  "short_description": "Transcribe source audio to transcript.json via Whisper.",
  "version": "1.0"
}
