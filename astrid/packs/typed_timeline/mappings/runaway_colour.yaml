canvas:
  width: 1280
  height: 720
  fps: 48
  total_frames: 8085
tracks:
  - id: colour
    kind: visual
    label: Colour
  - id: audio
    kind: audio
    label: Audio
scope: aggregated
clip:
  id: colour_map
  track: colour
  clipType: audio-reactive-colour
  initialColor:
    const: "#16B09B"
  events:
    frame:
      prefer: "metadata.frame"
      fallback:
        ms_to_frame: "start_ms"
    color:
      path: "metadata.colour_hex"
    id:
      path: "id"
audio_clip:
  id: source_audio
  track: audio
  asset: audio
transition: hard_cut
theme: banodoco-default
