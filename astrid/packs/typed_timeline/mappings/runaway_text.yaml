canvas:
  width: 1280
  height: 720
  fps: 48
  total_frames: 8085
tracks:
  - id: base
    kind: visual
    label: Base
  - id: overlay
    kind: visual
    label: Overlay
scope: per_row
clip:
  track: overlay
  clipType: text-card
  params:
    content:
      path: "prompt"
    align:
      const: "center"
theme: banodoco-default
