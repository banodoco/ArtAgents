{
  "schema_version": 1,
  "id": "typed_timeline.render",
  "name": "Typed Timeline Render",
  "kind": "built_in",
  "version": "1.0.0",
  "short_description": "Map typed rows then render via ffmpeg fast-path.",
  "description": "Children: typed_timeline.map then rendering.render (ffmpeg fast-path). Deterministic timeline into video.",
  "keywords": ["timeline", "render", "typed"],
  "child_executors": ["typed_timeline.map", "rendering.render"],
  "child_orchestrators": [],
  "cache": {"mode": "none"},
  "inputs": [
    {"name": "source", "type": "string", "required": false},
    {"name": "mapping", "type": "string", "required": false},
    {"name": "run_id", "type": "string", "required": false},
    {"name": "project", "type": "string", "required": false},
    {"name": "json_path", "type": "string", "required": false},
    {"name": "json_rows", "type": "json", "required": false}
  ],
  "runtime": {
    "kind": "command",
    "command": {
      "argv": ["{python_exec}", "-m", "astrid.packs.typed_timeline.orchestrators.render.run", "--source", "{source}", "--mapping", "{mapping}", "--out", "{out}"],
      "input_args": [
        {"input": "run_id", "flag": "--run-id", "optional": true},
        {"input": "project", "flag": "--project", "optional": true},
        {"input": "json_path", "flag": "--json-path", "optional": true},
        {"input": "json_rows", "flag": "--json-rows", "optional": true}
      ]
    }
  },
  "metadata": {
    "runtime_module": "astrid.packs.typed_timeline.orchestrators.render.run",
    "runtime_file": "run.py",
    "callable_module": "astrid.packs.typed_timeline.orchestrators.render.run",
    "callable_name": "main"
  }
}
