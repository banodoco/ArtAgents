    reason: Reads video files for upload and writes downloaded audio.
  - id: environment
    reason: Reads YouTube and social API credentials.
description: YouTube source acquisition and publishing executors.
content:
  executors: executors
aliases:
- kind: executor
  alias: builtin.youtube_audio
  canonical_id: youtube.youtube_audio
  deprecated: true
  deprecation_message: Moved to youtube.youtube_audio
- kind: executor
  alias: upload.youtube
  canonical_id: youtube.upload
  deprecated: true
  deprecation_message: Moved to youtube.upload
