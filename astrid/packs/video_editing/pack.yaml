schema_version: 1
id: video_editing
name: Astrid Video Editing
version: 1.0.0
origin: builtin
install_tier: core
pack_type: capability
domain: media
stability: stable
support: core
visibility: visible
permissions:
  - id: subprocess
    reason: Runs ffmpeg-based cut and foley executors plus orchestrator child processes.
  - id: project_files
    reason: Reads and writes timelines, assets, and editorial artifacts.
description: End-to-end video production orchestrators (hype edits, talks, thumbnails, logos, image animation) plus the timeline-cut executor.
keywords:
- video
- timeline
- edit
- hype
- thumbnail
- render
- animate
- grid
capabilities:
- run_hype_pipeline
- build_timeline
- assemble_event_talk
- make_thumbnails
- generate_logo_grid
- animate_image
- vary_image_grid
- render_iteration_video
agent:
  purpose: Choose this pack for video-production orchestrators and adjacent visual-generation workflows — hype, event, and iteration videos; thumbnails; logo grids; image animation; and grid variation.
  do_not_use_for: Do not use to merely understand/caption media (use understanding) or to run a raw ComfyUI generation graph (use vibecomfy); this pack owns the editorial assembly and render flow, distinct from the editorial pack's analysis stages it depends on.
  normal_entrypoints:
  - video_editing.hype
  - video_editing.event_talks
  - video_editing.thumbnail_maker
content:
  executors: executors
  orchestrators: orchestrators
aliases:
- kind: executor
  alias: builtin.cut
  canonical_id: video_editing.cut
  deprecated: true
  deprecation_message: Moved to video_editing.cut
- kind: orchestrator
  alias: builtin.hype
  canonical_id: video_editing.hype
  deprecated: true
  deprecation_message: Moved to video_editing.hype
- kind: orchestrator
  alias: builtin.event_talks
  canonical_id: video_editing.event_talks
  deprecated: true
  deprecation_message: Moved to video_editing.event_talks
- kind: orchestrator
  alias: builtin.thumbnail_maker
  canonical_id: video_editing.thumbnail_maker
  deprecated: true
  deprecation_message: Moved to video_editing.thumbnail_maker
- kind: orchestrator
  alias: builtin.iteration_video
  canonical_id: video_editing.iteration_video
  deprecated: true
  deprecation_message: Moved to video_editing.iteration_video
- kind: orchestrator
  alias: builtin.animate_image
  canonical_id: video_editing.animate_image
  deprecated: true
  deprecation_message: Moved to video_editing.animate_image
- kind: orchestrator
  alias: builtin.logo_ideas
  canonical_id: video_editing.logo_ideas
  deprecated: true
  deprecation_message: Moved to video_editing.logo_ideas
- kind: orchestrator
  alias: builtin.vary_grid
  canonical_id: video_editing.vary_grid
  deprecated: true
  deprecation_message: Moved to video_editing.vary_grid
metadata:
  layout:
    exceptions:
      - path: hype.py
        class: legacy_public_shim
        reason: "Legacy author-test DSL shim duplicating video_editing.hype (canonical at orchestrators/hype/run.py); removal deferred to M2."
        defer_to: M2
