schema_version: 1
id: text_analysis
name: Text Analysis
version: 0.1.0
description: A pack for text analysis and summarization.
origin: external
install_tier: core
pack_type: capability
domain: development
stability: stable
support: core
keywords: [text, summary, analysis, read, json]
capabilities: [read_text, summarize_text, write_verdict]
content:
  executors: executors
  orchestrators: orchestrators
  elements: elements
agent:
  purpose: Choose this pack for simple text file reading, summarization, and verdict generation.
  do_not_use_for: Do not use for video/audio/image processing.
  normal_entrypoints: [text_analysis.summarize]
  required_context: []
metadata:
  layout:
    exceptions:
      - path: summarize.py
        class: legacy_public_shim
        reason: "Compatibility re-export preserving astrid.packs.text_analysis.summarize while the canonical implementation lives at orchestrators/summarize/run.py."
        defer_to: M2
