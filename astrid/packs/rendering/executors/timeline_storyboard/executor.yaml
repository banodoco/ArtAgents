{
  "schema_version": 1,
  "id": "rendering.timeline_storyboard",
  "name": "Timeline Storyboard",
  "kind": "built_in",
  "version": "1.0",
  "short_description": "Build a static visual storyboard of image inputs associated with timeline shots.",
  "description": "Read a timeline and asset registry, resolve each pinned shot's ordered image inputs, and write a read-only JSON view model plus static HTML storyboard.",
  "keywords": [
    "timeline",
    "storyboard",
    "preview",
    "image",
    "shot",
    "range",
    "input"
  ],
  "inputs": [
    {
      "name": "timeline",
      "type": "file",
      "required": true,
      "artifact_type": "timeline",
      "description": "Timeline JSON containing clips and pinnedShotGroups."
    },
    {
      "name": "assets_registry",
      "type": "file",
      "required": true,
      "artifact_type": "timeline/assets",
      "description": "Asset registry JSON used to resolve input image references."
    },
    {
      "name": "shot_id",
      "type": "string",
      "required": false,
      "description": "Optional pinned shot id to preview; all pinned shots are included when omitted."
    }
  ],
  "outputs": [
    {
      "name": "preview_json",
      "type": "file",
      "path_template": "{out}/preview.json",
      "description": "Normalized read-only storyboard view model."
    },
    {
      "name": "preview_png",
      "type": "file",
      "path_template": "{out}/preview.png",
      "description": "Deterministic two-column contact sheet of resolved input images."
    },
    {
      "name": "preview_html",
      "type": "file",
      "path_template": "{out}/preview.html",
      "description": "Static visual storyboard with clickable input images."
    }
  ],
  "command": {
    "argv": [
      "{python_exec}",
      "-m",
      "astrid.packs.rendering.executors.timeline_storyboard.run",
      "--timeline",
      "{timeline}",
      "--assets-registry",
      "{assets_registry}",
      "--out",
      "{out}"
    ],
    "input_args": [
      {
        "flag": "--shot-id",
        "input": "shot_id",
        "optional": true,
        "repeatable": false
      }
    ]
  },
  "cache": {
    "mode": "none"
  },
  "isolation": {
    "mode": "subprocess",
    "network": false
  },
  "metadata": {
    "runtime_entrypoint": "main",
    "runtime_file": "run.py",
    "runtime_module": "astrid.packs.rendering.executors.timeline_storyboard.run",
    "output_result_manifest": true,
    "requires_timeline": false
  }
}
