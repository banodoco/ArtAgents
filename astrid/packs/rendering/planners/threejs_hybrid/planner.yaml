schema_version: 1
id: rendering.threejs-hybrid
name: Three.js and Remotion Hybrid Planner
version: 1.0.0
protocol_version: 1
command:
  - python3
  - planners/threejs_hybrid/run.py
operations:
  - support
  - plan
description: Route plain-text temporal regions to the Three.js renderer and everything else to Remotion, finalizing through FFmpeg.
capabilities:
  policies:
    - threejs_remotion
  supports_fallback: true
  features:
    integer_frame_windows: true
    conservative_occupancy_tiling: true
    explicit_finalizer: true
    non_recursive_dispatch: true
required_permissions:
  - project_files
  - subprocess
