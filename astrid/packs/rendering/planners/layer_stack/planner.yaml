schema_version: 1
id: rendering.layer-stack
name: Layer Stack Planner
version: 1.0.0
protocol_version: 1
command:
  - python3
  - run.py
operations:
  - support
  - plan
description: Route visual tracks into renderer-owned z-layers; composite via rendering.ffmpeg-compositor, or fast-path to one renderer + concat.
capabilities:
  policies:
    - layer_stack
  supports_fallback: true
  features:
    registry_support_routing: true
    per_layer_segments: true
    explicit_finalizer: true
    non_recursive_dispatch: true
required_permissions:
  - project_files
  - subprocess
