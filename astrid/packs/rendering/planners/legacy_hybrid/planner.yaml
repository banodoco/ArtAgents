schema_version: 1
id: rendering.legacy_hybrid
name: Legacy Hybrid Planner
version: 1.0.0
protocol_version: 1
command:
  - python3
  - run.py
operations:
  - plan
  - support
description: Plan legacy FFmpeg/Remotion hybrid renders as exact frame windows.
capabilities:
  policies:
    - hybrid
  supports_fallback: true
  features:
    integer_frame_windows: true
    transition_handles: true
    support_based_assignment: true
    explicit_finalizer: true
    non_recursive_dispatch: true
required_permissions:
  - project_files
  - subprocess
