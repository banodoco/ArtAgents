schema_version: 1
id: rendering.ffmpeg
name: FFmpeg Media Renderer
version: 1.0.0
protocol_version: 1
command:
  - python3
  - run.py
operations:
  - render
  - support
description: Render legacy media-only timelines with FFmpeg.
capabilities:
  clip_types:
    - media
  track_types:
    - visual
    - audio
  features:
    media_only: true
    stream_copy: true
    sequential_audio: true
  supports_full_timeline: true
  supports_windows: false
  output_profiles:
    - video/mp4
  audio_ownership:
    - rendered
    - passthrough
    - none
required_permissions:
  - project_files
  - subprocess
required_binaries:
  - ffmpeg
  - ffprobe
