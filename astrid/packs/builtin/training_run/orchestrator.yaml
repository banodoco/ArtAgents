{
  "id": "builtin.training_run",
  "name": "Training Run",
  "kind": "built_in",
  "version": "0.1.0",
  "short_description": "Run a generic LoRA training job from a prepared dataset manifest.",
  "description": "Coordinates generic manifest normalization, compute provisioning, remote trainer execution, artifact pulls, review, and registration for built-in LoRA training runs.",
  "keywords": [
    "training",
    "lora",
    "runpod",
    "checkpoint",
    "manifest",
    "artifact"
  ],
  "inputs": [
    {
      "name": "config",
      "type": "path",
      "required": true,
      "description": "Training run config JSON or YAML."
    },
    {
      "name": "out",
      "type": "path",
      "required": false,
      "description": "Optional output directory override; defaults to output.run_dir in config."
    }
  ],
  "outputs": [
    {
      "name": "run_state",
      "type": "json",
      "mode": "create_or_replace",
      "path_template": "{out}/last_run.json",
      "description": "Training-run state and resumability metadata."
    },
    {
      "name": "normalized_manifest",
      "type": "json",
      "mode": "create_or_replace",
      "path_template": "{out}/manifests/ai-toolkit-ltx/manifest.json",
      "description": "Training-run-owned normalized ai-toolkit LTX manifest copy."
    },
    {
      "name": "review_index",
      "type": "html",
      "mode": "create_or_replace",
      "path_template": "{out}/review/index.html",
      "description": "Local review page referencing downloaded checkpoint sample assets."
    },
    {
      "name": "registered_lora",
      "type": "json",
      "mode": "create_or_replace",
      "path_template": "{out}/registered_lora.json",
      "description": "Registration metadata for the selected LoRA checkpoint."
    }
  ],
  "runtime": {
    "kind": "command",
    "command": {
      "argv": [
        "{python_exec}",
        "-m",
        "astrid.packs.builtin.training_run.run",
        "{orchestrator_args}"
      ]
    }
  },
  "child_executors": [
    "external.runpod.provision",
    "external.runpod.exec",
    "external.runpod.pull",
    "external.runpod.teardown",
    "builtin.human_review"
  ],
  "child_orchestrators": [],
  "cache": {
    "mode": "none"
  },
  "isolation": {
    "mode": "subprocess",
    "network": true,
    "requirements": [
      "jsonschema"
    ]
  },
  "metadata": {
    "runtime_module": "astrid.packs.builtin.training_run.run",
    "runtime_file": "run.py",
    "runtime_entrypoint": "main",
    "package_paths": {
      "schemas": "../dataset_build/schemas/",
      "manifests": "manifests/",
      "state": "last_run.json"
    }
  }
}
