{
  "id": "builtin.clip_extract",
  "name": "Clip Extract",
  "kind": "built_in",
  "version": "1.0",
  "short_description": "Extract a clip segment from a video using ffmpeg stream copy.",
  "description": "Extract a clip segment from a source video using ffmpeg -ss (start time) and -t (duration) with stream copy (-c copy) for lossless, fast extraction.",
  "keywords": ["video", "clip", "ffmpeg", "extract", "trim", "segment"],
  "inputs": [
    {
      "name": "input",
      "type": "file",
      "required": true,
      "description": "Source video file path."
    },
    {
      "name": "start",
      "type": "number",
      "required": true,
      "description": "Start time in seconds."
    },
    {
      "name": "dur",
      "type": "number",
      "required": true,
      "description": "Duration in seconds."
    }
  ],
  "outputs": [
    {
      "name": "output",
      "type": "file",
      "path_template": "{out}/clip.mp4",
      "description": "The clipped video file."
    }
  ],
  "command": {
    "argv": [
      "{python_exec}",
      "-m",
      "astrid.packs.builtin.clip_extract.run",
      "--input",
      "{input}",
      "--start",
      "{start}",
      "--dur",
      "{dur}",
      "--output",
      "{output}"
    ]
  },
  "cache": {
    "mode": "none"
  },
  "isolation": {
    "mode": "subprocess",
    "network": false,
    "binaries": ["ffmpeg"]
  },
  "metadata": {
    "runtime_entrypoint": "main",
    "runtime_file": "run.py",
    "runtime_module": "astrid.packs.builtin.clip_extract.run"
  }
}
