schema_version: 1
id: runpod
name: Astrid RunPod
version: 1.0.0
origin: external
install_tier: core
pack_type: capability
domain: infrastructure
stability: stable
support: core
visibility: visible
permissions:
  - id: subprocess
    reason: Runs RunPod CLI commands as subprocesses.
  - id: network
    reason: Calls RunPod GraphQL API for pod provisioning and management.
  - id: environment
    reason: Reads RUNPOD_API_KEY for authentication.
  - id: external_services
    reason: Manages cloud GPU infrastructure on RunPod.
description: Provision RunPod GPU pods, ship and run scripts on them, pull artifacts, and tear pods down — including a guaranteed-cleanup composite session.
keywords:
- runpod
- gpu
- provision
- exec
- pull
- teardown
- session
- ssh
capabilities:
- provision_pod
- exec_on_pod
- pull_artifacts
- teardown_pod
- run_pod_session
agent:
  purpose: Choose this pack when you need ephemeral cloud GPU compute on RunPod — to spin up a pod, run a script remotely, retrieve artifacts/checkpoints, and shut it down. Prefer runpod.session for one-shot jobs that should always clean up.
  do_not_use_for: Not for orchestrating LoRA training workflows end to end; use the training pack, which drives RunPod under the hood.
  normal_entrypoints:
  - runpod.session
  - runpod.provision
content:
  executors: executors
aliases:
- kind: executor
  alias: external.runpod.provision
  canonical_id: runpod.provision
  deprecated: true
  deprecation_message: Moved to runpod.provision
- kind: executor
  alias: external.runpod.exec
  canonical_id: runpod.exec
  deprecated: true
  deprecation_message: Moved to runpod.exec
- kind: executor
  alias: external.runpod.pull
  canonical_id: runpod.pull
  deprecated: true
  deprecation_message: Moved to runpod.pull
- kind: executor
  alias: external.runpod.teardown
  canonical_id: runpod.teardown
  deprecated: true
  deprecation_message: Moved to runpod.teardown
- kind: executor
  alias: external.runpod.session
  canonical_id: runpod.session
  deprecated: true
  deprecation_message: Moved to runpod.session
