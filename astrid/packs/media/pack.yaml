schema_version: 1
id: media
name: Media
version: 0.1.0
origin: builtin
install_tier: core
pack_type: capability
domain: media
stability: stable
support: core
permissions:
  - id: subprocess
    reason: Runs ffmpeg for video clip extraction and audio remuxing/normalization.
  - id: project_files
    reason: Reads source video files and writes output clips.
  - id: network
    reason: Optional speech repair executor calls fal.ai LavaSR.
  - id: environment
    reason: Reads FAL_KEY for fal.ai speech repair.
description: Media processing tools, including clip extraction and weak-mic speech repair.
keywords:
  - video
  - clip
  - ffmpeg
  - extract
  - trim
  - segment
  - lossless
  - audio
  - speech
  - lavasr
capabilities:
  - extract_clip
  - trim_video
  - repair_speech
content:
  executors: executors
  orchestrators: orchestrators
  elements: elements
agent:
  purpose: "Use when you need to trim media segments or repair weak-mic speech in a video clip."
  do_not_use_for: "Not for building iteration videos from run history (use the iteration pack) or final timeline rendering (use the rendering pack)."
  normal_entrypoints:
    - media.clip_extract
    - media.speech_repair_lavasr
