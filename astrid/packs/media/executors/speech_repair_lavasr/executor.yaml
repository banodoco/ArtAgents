{
  "schema_version": 1,
  "id": "media.speech_repair_lavasr",
  "name": "Speech Repair LavaSR",
  "kind": "built_in",
  "version": "1.0",
  "scoped_configs": ["credentials.fal"],
  "short_description": "Repair weak-mic speech with hotter pre-lift, fal.ai LavaSR, optional DeepFilterNet3, and a final loudness pass.",
  "description": "Extract a video section, aggressively pre-lift weak speech, run fal-ai/lava-sr, optionally run fal-ai/deepfilternet3, then remux and loudness-master the repaired audio onto the extracted video.",
  "keywords": [
    "audio",
    "speech",
    "repair",
    "lavasr",
    "fal",
    "ffmpeg",
    "weak-mic"
  ],
  "inputs": [
    {
      "name": "input",
      "type": "file",
      "required": true,
      "description": "Source video file path.",
      "artifact_type": "audio"
    },
    {
      "name": "start",
      "type": "number",
      "required": true,
      "description": "Start time in seconds within the source video."
    },
    {
      "name": "dur",
      "type": "number",
      "required": true,
      "description": "Duration in seconds to extract and repair."
    },
    {
      "name": "env_file",
      "type": "file",
      "required": false,
      "description": "Optional .env file containing FAL_KEY."
    },
    {
      "name": "deepfilternet3",
      "type": "boolean",
      "required": false,
      "description": "Run fal-ai/deepfilternet3 after LavaSR before final loudness mastering."
    }
  ],
  "outputs": [
    {
      "name": "output",
      "type": "file",
      "path_template": "{out}/speech-repair-lavasr.mp4",
      "description": "The extracted clip with LavaSR-repaired, loudness-mastered audio.",
      "artifact_type": "audio"
    }
  ],
  "command": {
    "argv": [
      "{python_exec}",
      "-m",
      "astrid.packs.media.executors.speech_repair_lavasr.run",
      "--input",
      "{input}",
      "--start",
      "{start}",
      "--dur",
      "{dur}",
      "--output",
      "{output}"
    ],
    "input_args": [
      {
        "flag": "--env-file",
        "input": "env_file",
        "optional": true,
        "repeatable": false
      },
      {
        "flag": "--deepfilternet3",
        "input": "deepfilternet3",
        "optional": true,
        "repeatable": false
      }
    ]
  },
  "cache": {
    "mode": "none"
  },
  "isolation": {
    "mode": "subprocess",
    "network": true,
    "binaries": [
      "ffmpeg",
      "ffprobe"
    ],
    "secrets_required": [
      "FAL_KEY"
    ]
  },
  "metadata": {
    "runtime_entrypoint": "main",
    "runtime_file": "run.py",
    "runtime_module": "astrid.packs.media.executors.speech_repair_lavasr.run",
    "output_result_manifest": true,
    "network_policy": {"allowed_protocols":["dns","tcp"],"allowed_destinations":["queue.fal.run:443","fal.run:443","storage.fal.run:443"],"allow_redirects":false,"broker":{"host_managed":true,"kind":"broker","enforced":true,"observable":true,"route":"declared-http-routes","wrapper":"astrid-generic-host"},"descendant_enforcement":{"kind":"broker","validated":true,"observable":true,"route":"declared-http-routes","wrapper":"astrid-generic-host"}}}
}
