{
  "schema_version": 1,
  "id": "media.gif_search",
  "name": "GIF Search",
  "kind": "built_in",
  "version": "1.0",
  "scoped_configs": ["credentials.giphy"],
  "short_description": "Search GIPHY for GIF or sticker assets and optionally download a selected rendition.",
  "description": "Search GIPHY for GIFs or stickers, normalize the result metadata, write results.json and preview.html, and optionally download one selected rendition as MP4 or GIF for timeline use.",
  "keywords": [
    "gif",
    "gifs",
    "sticker",
    "stickers",
    "giphy",
    "search",
    "download",
    "asset",
    "media"
  ],
  "inputs": [
    {
      "name": "query",
      "type": "string",
      "required": true,
      "description": "Search query to send to the GIF provider."
    },
    {
      "name": "provider",
      "type": "string",
      "required": false,
      "description": "Provider to use. Currently only 'giphy' is implemented."
    },
    {
      "name": "media_kind",
      "type": "string",
      "required": false,
      "description": "Asset kind to search: 'gif' or 'sticker'."
    },
    {
      "name": "limit",
      "type": "integer",
      "required": false,
      "description": "Maximum number of results to return."
    },
    {
      "name": "rating",
      "type": "string",
      "required": false,
      "description": "GIPHY rating filter, such as g, pg, pg-13, or r."
    },
    {
      "name": "env_file",
      "type": "file",
      "required": false,
      "description": "Optional .env file containing GIPHY_API_KEY."
    },
    {
      "name": "download_index",
      "type": "integer",
      "required": false,
      "description": "Optional zero-based result index to download."
    },
    {
      "name": "download_id",
      "type": "string",
      "required": false,
      "description": "Optional provider result id to download."
    }
  ],
  "outputs": [
    {
      "name": "results",
      "type": "file",
      "path_template": "{out}/results.json",
      "description": "Normalized search result metadata."
    },
    {
      "name": "preview",
      "type": "file",
      "path_template": "{out}/preview.html",
      "description": "Static preview page for browsing returned assets."
    }
  ],
  "command": {
    "argv": [
      "{python_exec}",
      "-m",
      "astrid.packs.media.executors.gif_search.run",
      "--query",
      "{query}",
      "--out",
      "{out}"
    ],
    "input_args": [
      {
        "flag": "--provider",
        "input": "provider",
        "optional": true,
        "repeatable": false
      },
      {
        "flag": "--media-kind",
        "input": "media_kind",
        "optional": true,
        "repeatable": false
      },
      {
        "flag": "--limit",
        "input": "limit",
        "optional": true,
        "repeatable": false
      },
      {
        "flag": "--rating",
        "input": "rating",
        "optional": true,
        "repeatable": false
      },
      {
        "flag": "--env-file",
        "input": "env_file",
        "optional": true,
        "repeatable": false
      },
      {
        "flag": "--download-index",
        "input": "download_index",
        "optional": true,
        "repeatable": false
      },
      {
        "flag": "--download-id",
        "input": "download_id",
        "optional": true,
        "repeatable": false
      }
    ]
  },
  "cache": {
    "mode": "none"
  },
  "isolation": {
    "mode": "subprocess",
    "network": true,
    "secrets_required": [
      "GIPHY_API_KEY"
    ]
  },
  "metadata": {
    "runtime_entrypoint": "main",
    "runtime_file": "run.py",
    "runtime_module": "astrid.packs.media.executors.gif_search.run",
    "output_result_manifest": true
  }
}
