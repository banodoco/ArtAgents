# Astrid timeline schema pack (v10 section 2; decision artifact section 4).
#
# This is a schema-pack manifest, NOT a capability pack.yaml: it carries
# exactly the 11 snake_case top-level fields of the frozen schema-pack
# contract and is validated by astrid.core.schema_packs.manifest.
#
# The timeline pack owns two tables (timelines, timeline_contract_canary) and
# declares the namespaced timeline vocabulary. Timeline identity (slug,
# lowercase ULID, default) is NOT stored in convenience columns (SD1):
# immutable slug and ULID address metadata live in timeline.created event
# payloads and the default timeline id lives in projects.settings_json.
id: timeline
version: 3
depends_on:
  - core >= 1
migrations:
  - version: 1
    name: initial
    path: migrations/0001_initial.sql
    tables:
      - timelines
  - version: 2
    name: add_history_kind_index
    path: migrations/0002_add_history_kind_index.sql
    tables:
      - timeline_contract_canary
  - version: 3
    name: add_source_provenance
    path: migrations/0003_add_source_provenance.sql
    tables: []
stream_types:
  - timeline.timeline
event_kinds:
  - timeline.created
  - timeline.saved
  - timeline.archived
  - timeline.config_replaced
command_kinds:
  - timeline.create
  - timeline.save
  - timeline.archive
  - timeline.replace_config
repositories:
  - TimelineRepository
conformance:
  - replay
  - mismatch_before_mutation
  - same_project
  - vocabulary
  - writer_ownership
  - crash_atomicity
cli_mounts:
  timelines: timelines
bridge_mounts:
  - timelines
