schema_version: 1
id: generation
name: Astrid Generation
version: 1.0.0
origin: builtin
install_tier: core
pack_type: capability
domain: generation
stability: stable
support: core
visibility: visible
permissions:
  - id: subprocess
    reason: Runs vibecomfy and ComfyUI locally for image and video generation.
  - id: network
    reason: Calls fal.ai cloud API and downloads models for cloud backends.
  - id: project_files
    reason: Reads reference images and prompt files; writes generated outputs.
  - id: environment
    reason: Reads FAL_KEY for cloud generation backends.
description: Generative image and video executors.
content:
  executors: executors
aliases:
- kind: executor
  alias: builtin.generate_image
  canonical_id: generation.generate_image
  deprecated: true
  deprecation_message: Moved to generation.generate_image
- kind: executor
  alias: builtin.generate_image_openai
  canonical_id: generation.generate_image_openai
  deprecated: true
  deprecation_message: Moved to generation.generate_image_openai
- kind: executor
  alias: builtin.generate_video
  canonical_id: generation.generate_video
  deprecated: true
  deprecation_message: Moved to generation.generate_video
