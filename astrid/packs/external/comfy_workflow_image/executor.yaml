{
  "cache": {
    "mode": "none"
  },
  "command": {
    "argv": [
      "{python_exec}",
      "-m",
      "astrid.packs.external.comfy_workflow_image.run",
      "--prompt",
      "{prompt}",
      "--out",
      "{out}"
    ]
  },
  "conditions": [
    {
      "input": "prompt",
      "kind": "requires_input"
    }
  ],
  "description": "Render an image from a text prompt by injecting it into a fixed SDXL ComfyUI workflow JSON and submitting via the VibeComfy CLI (the same comfy surface external.vibecomfy.run uses).",
  "graph": {
    "consumes": [
      "prompt"
    ],
    "provides": [
      "image"
    ]
  },
  "id": "external.comfy_workflow_image",
  "inputs": [
    {
      "description": "Positive prompt injected into node '6' (CLIPTextEncode) of the staged workflow.",
      "name": "prompt",
      "required": true,
      "type": "string"
    },
    {
      "default": "",
      "description": "Optional override ComfyUI workflow JSON; defaults to the pack-staged workflow.json.",
      "name": "workflow",
      "required": false,
      "type": "file"
    }
  ],
  "isolation": {
    "mode": "subprocess",
    "network": true,
    "requirements": [
      "vibecomfy"
    ]
  },
  "keywords": [
    "comfyui",
    "vibecomfy",
    "image",
    "generate",
    "text-to-image",
    "sdxl",
    "workflow",
    "prompt"
  ],
  "kind": "external",
  "metadata": {
    "comfy_surface": "vibecomfy.cli",
    "depends_on_executor": "external.vibecomfy.run",
    "positive_prompt_node_id": "6",
    "positive_prompt_key": "text",
    "runtime_entrypoint": "main",
    "runtime_file": "run.py",
    "runtime_module": "astrid.packs.external.comfy_workflow_image.run",
    "staged_workflow": "workflow.json"
  },
  "name": "Comfy Workflow Image",
  "outputs": [
    {
      "description": "Rendered image file written to --out.",
      "mode": "create_or_replace",
      "name": "image",
      "path_template": "{out}",
      "type": "file"
    }
  ],
  "short_description": "Render an image from --prompt through a fixed ComfyUI workflow via the VibeComfy CLI.",
  "version": "0.1.0"
}
