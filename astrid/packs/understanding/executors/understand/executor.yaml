{
  "schema_version": 1,
  "cache": {
    "mode": "none"
  },
  "command": {
    "argv": [
      "{python_exec}",
      "-m",
      "astrid.packs.understanding.executors.understand.run",
      "--mode",
      "{mode}"
    ]
  },
  "description": "Dispatch to the audio, visual, or video understanding executor based on --mode.",
  "id": "understanding.understand",
  "inputs": [
    {
      "description": "Understanding modality: audio | image | visual | video. Determines which underlying executor receives the call.",
      "name": "mode",
      "required": true,
      "type": "string"
    },
    {
      "description": "Audio input required when mode=audio.",
      "name": "audio",
      "required": false,
      "type": "file",
      "artifact_type": "audio"
    },
    {
      "description": "Image input required when mode=image or visual.",
      "name": "image",
      "required": false,
      "type": "file",
      "artifact_type": "image"
    },
    {
      "description": "Video input required when mode=video.",
      "name": "video",
      "required": false,
      "type": "file",
      "artifact_type": "video/clip"
    },
    {
      "description": "Optional timestamp or query forwarded to the selected modality executor.",
      "name": "at",
      "required": false,
      "type": "string"
    },
    {
      "description": "Optional question forwarded to the selected modality executor.",
      "name": "query",
      "required": false,
      "type": "string"
    }
  ],
  "isolation": {
    "mode": "subprocess",
    "network": true
  },
  "keywords": [
    "understand",
    "dispatch",
    "audio",
    "video",
    "image",
    "llm"
  ],
  "kind": "built_in",
  "metadata": {
    "env": ["OPENAI_API_KEY"],
    "input_choices": {
      "mode": ["audio", "image", "video", "visual"]
    },
    "input_requirements_by_choice": {
      "mode": {
        "audio": ["audio"],
        "image": ["image"],
        "visual": ["image"],
        "video": ["video"]
      }
    },
    "secrets_required": ["OPENAI_API_KEY"],
    "requires_timeline": false,
    "runtime_entrypoint": "main",
    "runtime_file": "run.py",
    "runtime_module": "astrid.packs.understanding.executors.understand.run",
    "network_policy": {"allowed_protocols":["dns","tcp"],"allowed_destinations":["api.openai.com:443"],"allow_redirects":false}},
  "name": "Understand",
  "short_description": "Dispatch to the audio, visual, or video understanding executor based on --mode.",
  "version": "1.0"
}
