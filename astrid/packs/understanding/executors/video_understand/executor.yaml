{
  "schema_version": 1,
  "cache": {
    "mode": "none"
  },
  "command": {
    "argv": [
      "{python_exec}",
      "-m",
      "astrid.packs.understanding.executors.video_understand.run"
    ]
  },
  "description": "Inspect synchronized audio/video windows with a video-understanding model.",
  "id": "understanding.video_understand",
  "inputs": [
    {
      "description": "Video to inspect.",
      "name": "video",
      "required": false,
      "type": "file",
      "artifact_type": "video/clip"
    },
    {
      "description": "Question or evaluation rubric for the video-understanding model.",
      "name": "query",
      "required": false,
      "type": "string"
    },
    {
      "description": "Model preset: fast or best.",
      "name": "mode",
      "required": false,
      "type": "string"
    },
    {
      "description": "Optional JSON response schema used to constrain the model output.",
      "name": "response_schema",
      "required": false,
      "type": "file"
    },
    {
      "description": "Directory for extracted video windows and the result manifest.",
      "name": "out_dir",
      "required": false,
      "type": "directory"
    },
    {
      "description": "Optional JSON result file.",
      "name": "out",
      "required": false,
      "type": "file"
    }
  ],
  "isolation": {
    "mode": "subprocess",
    "network": true
  },
  "keywords": [
    "video",
    "understand",
    "llm",
    "audio",
    "describe",
    "analyze"
  ],
  "kind": "built_in",
  "metadata": {
    "env": ["OPENAI_API_KEY"],
    "secrets_required": ["OPENAI_API_KEY"],
    "output_result_manifest": true,
    "requires_timeline": false,
    "runtime_entrypoint": "main",
    "runtime_file": "run.py",
    "runtime_module": "astrid.packs.understanding.executors.video_understand.run"
  },
  "name": "Video Understand",
  "short_description": "Inspect synchronized audio+video windows with a video-understanding model.",
  "version": "1.0"
}
