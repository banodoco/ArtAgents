{
  "schema_version": 1,
  "cache": {
    "mode": "none"
  },
  "command": {
    "argv": [
      "{python_exec}",
      "-m",
      "astrid.packs.understanding.executors.audio_understand.run",
      "--out-dir",
      "{out}",
      "--out",
      "{analysis}"
    ]
  },
  "description": "Inspect audio clips or sampled windows with an audio-understanding model.",
  "id": "understanding.audio_understand",
  "inputs": [
    {
      "description": "Audio clip to inspect.",
      "name": "audio",
      "required": true,
      "type": "file",
      "artifact_type": "audio"
    }
  ],
  "isolation": {
    "network": true,
    "mode": "subprocess"
  },
  "keywords": [
    "audio",
    "understand",
    "llm",
    "analyze",
    "transcript",
    "describe"
  ],
  "kind": "built_in",
  "metadata": {
    "env": ["OPENAI_API_KEY"],
    "required_permissions": ["network", "environment"],
    "secrets_required": ["OPENAI_API_KEY"],
    "output_result_manifest": true,
    "requires_timeline": false,
    "runtime_entrypoint": "main",
    "runtime_file": "run.py",
    "runtime_module": "astrid.packs.understanding.executors.audio_understand.run",
    "network_policy": {"allowed_protocols":["dns","tcp"],"allowed_destinations":["api.openai.com:443"],"allow_redirects":false}},
  "name": "Audio Understand",
  "outputs": [
    {
      "name": "analysis",
      "type": "file",
      "mode": "create_or_replace",
      "path_template": "{out}/analysis.json",
      "artifact_type": "understanding/audio"
    },
    {
      "name": "manifest",
      "type": "file",
      "mode": "create_or_replace",
      "path_template": "{out}/manifest.json",
      "artifact_type": "metadata/result-manifest"
    }
  ],
  "short_description": "Inspect audio clips or sampled windows with an audio-understanding LLM.",
  "version": "1.0"
}
