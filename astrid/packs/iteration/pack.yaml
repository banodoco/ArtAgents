schema_version: 2
id: iteration
name: Astrid Iteration
version: 1.0.0
status: active
domain: development
stability: stable
support: core
permissions:
  - id: subprocess
    reason: Runs iteration assembly and experiment executors as subprocesses.
  - id: project_files
    reason: Reads iteration manifests and writes timeline and asset files.
description: Builds an iteration video from runtime-owned run provenance — discovers candidate runs through the generated client, scores quality, and assembles a canonical iteration timeline plus render-ready hype inputs. Also provides provider-independent experiment preparation and review.
keywords:
  - iteration
  - provenance
  - runtime
  - quality
  - timeline
  - hype
  - video
  - assemble
  - experiment
  - review
  - provider-independent
capabilities:
  - collect_runtime_provenance
  - score_iteration_quality
  - assemble_iteration_timeline
  - emit_render_adapter
  - experiment_prepare
  - experiment_review
  - experiment_import
  - experiment_review_session
content:
  executors: executors
  orchestrators: orchestrators
documentation:
  kind: skill
  path: skill/SKILL.md
agent:
  purpose: "Use to turn runtime-owned run history into an iteration video artifact: discover provenance/quality from the selected project runtime, then assemble the canonical iteration timeline and render-compatible hype inputs."
  do_not_use_for: "Not for raw video editing or clip trimming (use the media pack) or final video rendering (use the rendering pack on the emitted hype adapter)."
  normal_entrypoints:
    - iteration.assemble
