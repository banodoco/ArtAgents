{
  "schema_version": 1,
  "cache": {
    "mode": "none"
  },
  "child_executors": [
    "iteration.experiment_prepare",
    "editorial.human_review"
  ],
  "child_orchestrators": [],
  "description": "Interactive, schema-validated rubric review session over a prepared experiment review. Reuses editorial.human_review as the server and mounts each run's media under a safe per-run route.",
  "id": "iteration.experiment_review_session",
  "isolation": {
    "mode": "subprocess",
    "network": false
  },
  "keywords": [
    "experiment",
    "review",
    "rubric",
    "human-review",
    "session",
    "media-mount",
    "provider-independent"
  ],
  "kind": "built_in",
  "metadata": {
    "requires_timeline": false,
    "runtime_entrypoint": "main",
    "runtime_file": "run.py",
    "runtime_module": "astrid.packs.iteration.orchestrators.experiment_review_session.run"
  },
  "name": "Experiment Review Session",
  "runtime": {
    "command": {
      "argv": [
        "{python_exec}",
        "-m",
        "astrid.packs.iteration.orchestrators.experiment_review_session.run",
        "{orchestrator_args}"
      ]
    },
    "kind": "command"
  },
  "short_description": "Interactive rubric review session over a prepared experiment, reusing editorial.human_review with safe mounted media.",
  "version": "1.0"
}
