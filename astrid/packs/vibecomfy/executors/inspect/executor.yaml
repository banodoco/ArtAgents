{
  "schema_version": 1,
  "id": "vibecomfy.inspect",
  "name": "VibeComfy Inspect",
  "kind": "external",
  "version": "1.0.0",
  "short_description": "Render a ComfyUI UI graph as readable Python-like VibeComfy IR.",
  "description": "Read an admitted UI workflow without mutation and emit the VibeComfy census, readable Python-like surface, and complete computed topology as runtime-owned artifacts.",
  "keywords": ["comfyui", "vibecomfy", "workflow", "inspect", "ir"],
  "inputs": [
    {"name": "workflow", "type": "file", "required": true, "artifact_type": "vibecomfy/ui-workflow", "description": "Runtime-admitted ComfyUI UI workflow JSON."}
  ],
  "outputs": [
    {"name": "projection", "type": "file", "path_template": "{out}/workflow-ir.py", "artifact_type": "text/x-python", "description": "Read-only Python-like IR projection."},
    {"name": "inspection", "type": "file", "path_template": "{out}/inspection.json", "artifact_type": "vibecomfy/ir-inspection", "description": "Structured census, surface, topology, and authority metadata."}
  ],
  "command": {
    "argv": ["{python_exec}", "-m", "astrid.packs.vibecomfy.executors.inspect.run", "--workflow", "{workflow}", "--out", "{out}"]
  },
  "cache": {"mode": "none"},
  "conditions": [{"kind": "requires_input", "input": "workflow"}],
  "graph": {"consumes": ["workflow"], "provides": ["vibecomfy_ir_projection"]},
  "isolation": {"mode": "subprocess", "network": false, "requirements": ["vibecomfy"]},
  "metadata": {
    "pack_id": "vibecomfy",
    "runtime_module": "astrid.packs.vibecomfy.executors.inspect.run",
    "runtime_file": "run.py",
    "vibecomfy_command": "inspect_ir",
    "authority": "input_ui_graph",
    "mutation": "none"
  }
}
