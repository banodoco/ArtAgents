{
  "schema_version": 1,
  "id": "vibecomfy.edit",
  "name": "VibeComfy Edit",
  "kind": "external",
  "version": "1.0.0",
  "short_description": "Apply an atomic batch of typed VibeComfy edits to a ComfyUI UI graph.",
  "description": "Ingest an admitted UI workflow once, apply only VibeComfy's typed edit tools as one atomic delta batch, and emit a new UI graph plus projection and audit report.",
  "keywords": ["comfyui", "vibecomfy", "workflow", "edit", "typed-delta"],
  "inputs": [
    {"name": "workflow", "type": "file", "required": true, "artifact_type": "vibecomfy/ui-workflow", "description": "Runtime-admitted ComfyUI UI workflow JSON."},
    {"name": "operations", "type": "file", "required": true, "artifact_type": "vibecomfy/typed-edit-batch", "description": "JSON document containing schema_version, expected_revision, and a non-empty ops array."}
  ],
  "outputs": [
    {"name": "workflow", "type": "file", "path_template": "{out}/workflow.ui.json", "artifact_type": "vibecomfy/ui-workflow", "description": "Edited UI workflow emitted through VibeComfy's UI door."},
    {"name": "projection", "type": "file", "path_template": "{out}/workflow-ir.py", "artifact_type": "text/x-python", "description": "Read-only projection of the edited retained IR."},
    {"name": "report", "type": "file", "path_template": "{out}/edit-report.json", "artifact_type": "vibecomfy/typed-edit-report", "description": "Input/output digests, revision, delta id, canonical typed delta, and diagnostics."}
  ],
  "command": {
    "argv": ["{python_exec}", "-m", "astrid.packs.vibecomfy.executors.edit.run", "--workflow", "{workflow}", "--operations", "{operations}", "--out", "{out}"]
  },
  "cache": {"mode": "none"},
  "conditions": [
    {"kind": "requires_input", "input": "workflow"},
    {"kind": "requires_input", "input": "operations"}
  ],
  "graph": {"consumes": ["workflow", "vibecomfy_typed_edit_batch"], "provides": ["workflow", "vibecomfy_typed_edit_report"]},
  "isolation": {"mode": "subprocess", "network": false, "requirements": ["vibecomfy"]},
  "metadata": {
    "pack_id": "vibecomfy",
    "runtime_module": "astrid.packs.vibecomfy.executors.edit.run",
    "runtime_file": "run.py",
    "vibecomfy_command": "typed_edit",
    "authority": "input_ui_graph_plus_typed_delta",
    "accepted_tools": ["edit_node", "add_node", "remove_node", "upsert_link", "remove_link", "set_node_mode"],
    "batching_tool": "edit_batch",
    "atomic": true
  }
}
