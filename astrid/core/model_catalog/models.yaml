schema_version: 2

# param_map is optional for fal cloud and vibecomfy local backends.
# When absent or empty, the adapter falls back to its DEFAULT_PARAM_MAP
# class variable (FalBackend or VibeComfyBackend).  Codex backends
# never read param_map; their entries are preserved as harmless dead data
# (SD-002).  The schema cross-check (typo detection) still runs against
# any param_map entries that *are* present (SD-003).
#
models:
  # =========================================================================
  # z-image — Z Image Turbo (text-to-image + image-to-image)
  #
  # Local templates (vibecomfy):
  #   t2i: image/z_image — bind_input: prompt, negative_prompt, seed, steps,
  #        width, height.  No count bind_input (adapter handles via loop).
  #   i2i: image/z_image_img2img — NO bind_input calls (bare template).
  #        Adapter uses wf.inputs name-matching fallback with logged warning
  #        (FLAG-003).
  #
  # Cloud endpoints (fal):
  #   t2i: fal-ai/z-image/turbo — confirmed via web search (T1 prep).
  #   i2i: fal-ai/z-image/turbo/image-to-image — confirmed via web search
  #        (T1 prep).  Note: Z Image Turbo cloud does NOT expose
  #        negative_prompt; the feature is in mode.supports (local backend
  #        supports it) but absent from cloud param_map, so the adapter
  #        drops it with a warning when using cloud execution.
  #
  # SD-001: z-image id refers to the Z Image Turbo checkpoint.  Local and
  # cloud backends both produce Z-Image-comparable output.
  # =========================================================================
  - id: z-image
    modality: image
    modes:
      t2i:
        supports:
          - prompt
          - negative_prompt
          - seed
          - count
          - size
          - guidance_scale
          - steps
        requires:
          - prompt
        backends:
          local:
            template: image/z_image
            template_hash: "sha256:a8bb7f5397bbafef1e9545b7c0ebbb196db88027de94b3c417cd9c2ee4b8b70b"
          cloud:
            endpoint: fal-ai/z-image/turbo
            lora_endpoint: fal-ai/z-image/turbo/lora
          codex:
            endpoint: codex/gpt-image
            param_map:
              prompt: prompt
              negative_prompt: negative_prompt
              seed: seed
              count: count
              size: size
              guidance_scale: guidance_scale
              steps: steps

      i2i:
        supports:
          - prompt
          - seed
          - image_ref
          - size
          - strength
          - guidance_scale
          - steps
        requires:
          - prompt
          - image_ref
        backends:
          local:
            template: image/z_image_img2img
            template_hash: "sha256:32d0319740738742b9320f810b6ead9bd47a0196c5008ed4476913d3b32dd880"
          cloud:
            endpoint: fal-ai/z-image/turbo/image-to-image
          codex:
            endpoint: codex/gpt-image
            param_map:
              prompt: prompt
              seed: seed
              image_ref: image_ref
              size: size
              strength: strength
              guidance_scale: guidance_scale
              steps: steps

  # =========================================================================
  # qwen-image-2512 — Qwen Image 2512 (Lightning 4-step) text-to-image
  #
  # Local template (vibecomfy):
  #   t2i: image/qwen_image_2512 — bind_input: prompt, negative_prompt, seed,
  #        width, height.  Checkpoint: qwen_image_2512_fp8_e4m3fn.safetensors
  #        + qwen-image-2512-lightning-4steps-v1.0-fp32.safetensors.
  #
  # Cloud endpoint (fal):
  #   t2i: fal-ai/qwen-image — confirmed via web search (T1 prep).
  #
  # SD-001: qwen-image-2512 and qwen-image-edit are DIFFERENT checkpoints
  # (qwen_image_2512_fp8 vs qwen_image_edit_fp8) — split into separate
  # model IDs.  qwen-image-2512 is t2i only.
  # =========================================================================
  - id: qwen-image-2512
    modality: image
    modes:
      t2i:
        supports:
          - prompt
          - negative_prompt
          - seed
          - count
          - size
          - guidance_scale
          - steps
        requires:
          - prompt
        backends:
          local:
            template: image/qwen_image_2512
            template_hash: "sha256:c0716acf518923907b78c1d8e3f9bc0ab1c2dae54589c2a3a289998e8d4baf44"
          cloud:
            endpoint: fal-ai/qwen-image
          codex:
            endpoint: codex/gpt-image
            param_map:
              prompt: prompt
              negative_prompt: negative_prompt
              seed: seed
              count: count
              size: size
              guidance_scale: guidance_scale
              steps: steps

  # =========================================================================
  # qwen-image-edit — Qwen Image Edit (instruction-guided) edit mode only
  #
  # Local template (vibecomfy):
  #   edit: edit/qwen_image_edit — bind_input: image, prompt, seed.
  #         Checkpoint: qwen_image_edit_fp8_e4m3fn.safetensors
  #         + qwen-image-edit-lightning-4steps-v1.0-bf16.safetensors.
  #
  # Cloud endpoint (fal):
  #   edit: fal-ai/qwen-image-edit — confirmed via web search (T1 prep).
  #
  # SD-003: Edit mode per-mode supports excludes negative_prompt and strength.
  # SD-001: Separate model ID from qwen-image-2512 (different checkpoint).
  # =========================================================================
  - id: qwen-image-edit
    modality: image
    modes:
      edit:
        supports:
          - prompt
          - seed
          - count
          - image_ref
          - size
          - guidance_scale
          - steps
        requires:
          - prompt
          - image_ref
        backends:
          local:
            template: edit/qwen_image_edit
            template_hash: "sha256:2620132e816257fe7ad3ab06e5c226ca0f59438161e48dedc6364267820f5b37"
          cloud:
            endpoint: fal-ai/qwen-image-edit
          codex:
            endpoint: codex/gpt-image
            param_map:
              prompt: prompt
              seed: seed
              count: count
              image_ref: image_ref
              size: size
              guidance_scale: guidance_scale
              steps: steps

  # =========================================================================
  # flux-dev — Flux Dev (text-to-image + image-to-image; no local template)
  #
  # No local vibecomfy template for actual Flux Dev checkpoint exists.
  # The v1 entry (mis)mapped flux-dev local → image/z_image (Z Image Turbo,
  # a different model).  SD-001 forbids that — flux-dev has no local backend.
  #
  # Cloud endpoints (fal):
  #   t2i: fal-ai/flux/dev — confirmed.
  #   i2i: fal-ai/flux/dev/image-to-image — confirmed.
  #
  # Note: fal-ai/flux/dev does NOT support negative_prompt on cloud
  # (confirmed via fal endpoint catalog).  negative_prompt is NOT in
  # the mode's supports list; if a caller supplies it the adapter drops
  # it with a warning.
  # =========================================================================
  - id: flux-dev
    modality: image
    modes:
      t2i:
        supports:
          - prompt
          - seed
          - count
          - size
          - guidance_scale
          - steps
        requires:
          - prompt
        backends:
          cloud:
            endpoint: fal-ai/flux/dev
            lora_endpoint: fal-ai/flux-lora
            price:
              unit: image
              usd: 0.025
          codex:
            endpoint: codex/gpt-image
            param_map:
              prompt: prompt
              seed: seed
              count: count
              size: size
              guidance_scale: guidance_scale
              steps: steps

      i2i:
        supports:
          - prompt
          - seed
          - count
          - image_ref
          - size
          - strength
          - guidance_scale
          - steps
        requires:
          - prompt
          - image_ref
        backends:
          cloud:
            endpoint: fal-ai/flux/dev/image-to-image
          codex:
            endpoint: codex/gpt-image
            param_map:
              prompt: prompt
              seed: seed
              count: count
              image_ref: image_ref
              size: size
              strength: strength
              guidance_scale: guidance_scale
              steps: steps

  # =========================================================================
  # flux-schnell — Flux Schnell (text-to-image) CLOUD-ONLY
  #
  # No local vibecomfy template for Flux Schnell.  Cloud-only.
  #
  # Cloud endpoint (fal):
  #   t2i: fal-ai/flux/schnell — confirmed.
  #
  # guidance_scale is always 1.0 for Schnell (model constraint).  It is
  # included in supports (not omitted) per settled decision; the adapter
  # enforces the 1.0 override.
  # =========================================================================
  - id: flux-schnell
    modality: image
    modes:
      t2i:
        supports:
          - prompt
          - seed
          - count
          - size
          - guidance_scale
          - steps
        requires:
          - prompt
        backends:
          cloud:
            endpoint: fal-ai/flux/schnell
            hints:
              guidance_scale_override: 1.0
          codex:
            endpoint: codex/gpt-image
            param_map:
              prompt: prompt
              seed: seed
              count: count
              size: size
              guidance_scale: guidance_scale
              steps: steps

  # =========================================================================
  # flux2-klein-9b — BFL Flux 2 Klein 9B (Flux 2 family flagship)
  #
  # Cloud-only.  Local template (image/flux2_klein_9b_t2i.py) is opaque
  # (no bind_input), so it cannot be driven by param_map.  See sprint-02
  # prep findings.  The gguf variant exists but requires GGUF custom nodes.
  # =========================================================================
  - id: flux2-klein-9b
    modality: image
    modes:
      t2i:
        supports:
          - prompt
          - seed
          - size
          - guidance_scale
          - steps
          - negative_prompt
        requires:
          - prompt
        backends:
          cloud:
            endpoint: fal-ai/flux-2/klein/9b
            lora_endpoint: fal-ai/flux-2/lora
          codex:
            endpoint: codex/gpt-image
            param_map:
              prompt: prompt
              seed: seed
              size: size
              guidance_scale: guidance_scale
              steps: steps
              negative_prompt: negative_prompt

  # =========================================================================
  # flux2-klein-4b — BFL Flux 2 Klein 4B (smaller, faster Flux 2 variant)
  #
  # Cloud verified.  Local template (image/flux2_klein_4b_t2i.py) has
  # bind_input (prompt, negative_prompt, seed, width, height) and could be
  # wired in a follow-up; left local-absent for now pending parity tests.
  # =========================================================================
  - id: flux2-klein-4b
    modality: image
    modes:
      t2i:
        supports:
          - prompt
          - seed
          - size
          - guidance_scale
          - steps
          - negative_prompt
        requires:
          - prompt
        backends:
          cloud:
            endpoint: fal-ai/flux-2/klein/4b
          codex:
            endpoint: codex/gpt-image
            param_map:
              prompt: prompt
              seed: seed
              size: size
              guidance_scale: guidance_scale
              steps: steps
              negative_prompt: negative_prompt

  # =========================================================================
  # ideogram-v4 — Ideogram V4 (text-to-image) CLOUD-ONLY
  #
  # Cloud endpoint (fal):
  #   t2i: ideogram/v4 — confirmed via fal model card + live API call
  #        (https://fal.ai/models/ideogram/v4).  NOTE: no `fal-ai/` prefix,
  #        unlike ideogram v3 (fal-ai/ideogram/v3).  The bare `fal-ai/...`
  #        path 404s ("Path /v4 not found") on result fetch.
  #
  # fal input schema exposes: prompt (required), image_size, num_images,
  # seed, rendering_speed (default BALANCED), expansion_model, num_images.
  # It does NOT expose negative_prompt, guidance_scale, or step count, so
  # those canonical features are omitted from supports.  rendering_speed /
  # expansion_model are ideogram-specific (no canonical feature) and use
  # the fal defaults.
  #
  # No local vibecomfy template yet (Ideogram 4.0 has open FP8 weights with
  # day-0 ComfyUI support, so a `local` backend is feasible later — needs a
  # ready-template + weights download).  Cloud-only for now.
  #
  # Pricing on fal is per output megapixel ($0.03/$0.06/$0.10 per MP for
  # turbo/balanced/quality).  fal reports the actual per-request cost, which
  # the adapter prefers; the price below is an approximate balanced-mode,
  # ~1 MP (square_hd) fallback used only if the API omits a cost.
  # =========================================================================
  - id: ideogram-v4
    modality: image
    modes:
      t2i:
        supports:
          - prompt
          - seed
          - count
          - size
        requires:
          - prompt
        backends:
          cloud:
            endpoint: ideogram/v4
            hints:
              enable_safety_checker: false
            price:
              unit: image
              usd: 0.06
          codex:
            endpoint: codex/gpt-image
            param_map:
              prompt: prompt
              seed: seed
              count: count
              size: size

  # =========================================================================
  # wan-2.2 — Wan 2.2 A14B (text-to-video + image-to-video + first-last-frame)
  #
  # Local templates (vibecomfy):
  #   i2v: video/wan22_i2v_comfy_lightx2v — ComfyUI native WanImageToVideo
  #        with fp8 high/low diffusion models and Lightx2v 4-step LoRAs.
  #        unbound_inputs: image, prompt, negative_prompt, seed,
  #        width, height, num_frames, steps.
  #        FLAG-003: bare template — no bind_input calls; adapter uses
  #        unbound_inputs + node-target fallback.
  #   t2v: ABSENT per FLAG-001 — no local wan-2.2 text-to-video template
  #        exists, and wan2.1 substitution is forbidden (SD-001).
  #
  # Cloud endpoints (fal):
  #   t2v: fal-ai/wan/v2.2-a14b/text-to-video/turbo — confirmed.
  #   i2v: fal-ai/wan/v2.2-a14b/image-to-video/turbo — confirmed.
  #        Accepts end_image_url (Q1 confirmed via playground), so flf is wired.
  #
  # Q2: negative_prompt accepted on t2v and i2v (confirmed via web search).
  # =========================================================================
  - id: wan-2.2
    modality: video
    modes:
      t2v:
        supports:
          - prompt
          - negative_prompt
          - seed
          - frames
          - fps
          - duration
          - resolution
          - guidance_scale
          - steps
          - shift
          - loras
          - enable_safety_checker
          - enable_prompt_expansion
          - acceleration
        requires:
          - prompt
        backends:
          cloud:
            endpoint: fal-ai/wan/v2.2-a14b/text-to-video/turbo
      i2v:
        supports:
          - prompt
          - negative_prompt
          - seed
          - image_ref
          - resolution
          - frames
          - guidance_scale
          - steps
          - shift
          - loras
          - enable_safety_checker
          - enable_prompt_expansion
          - acceleration
        requires:
          - prompt
          - image_ref
        backends:
          local:
            template: video/wan22_i2v_comfy_lightx2v
            template_hash: "sha256:272d03627814489a707c4d98553611072244a0b40f9657ed29330dd5c06afc77"
          cloud:
            endpoint: fal-ai/wan/v2.2-a14b/image-to-video/turbo
      flf:
        supports:
          - prompt
          - negative_prompt
          - seed
          - image_ref
          - image_end_ref
          - resolution
          - frames
          - guidance_scale
          - steps
          - shift
          - loras
          - enable_safety_checker
          - enable_prompt_expansion
          - acceleration
        requires:
          - prompt
          - image_ref
          - image_end_ref
        backends:
          cloud:
            endpoint: fal-ai/wan/v2.2-a14b/image-to-video/turbo
  # =========================================================================
  # ltx-2.3 — LTX-2.3 (text-to-video + image-to-video + first-last-frame)
  #
  # Local templates (vibecomfy):
  #   t2v: video/ltx2_3_t2v — bind_input: prompt, negative_prompt, seed,
  #        width, height, frames, fps.
  #   i2v: video/ltx2_3_i2v — bind_input: image, prompt, negative_prompt,
  #        seed, width, height, frames, fps.
  #        FLAG-005: canonical image_ref maps to local param name "image"
  #        (not "image_ref").  The rename is intentional — LTX local
  #        templates use "image" as the bind_input name for the start
  #        frame.
  #   flf: video/ltx2_3_runexx_first_last_frame — register_input:
  #        start_image, end_image, prompt, negative_prompt, seed,
  #        frames, width, height, fps.
  #        FLAG-003: bare template — uses register_input not bind_input;
  #        adapter emits a warning.
  #
  # Cloud endpoints (fal):
  #   t2v: fal-ai/ltx-2.3/text-to-video/fast — confirmed.
  #   i2v: fal-ai/ltx-2.3/image-to-video/fast — confirmed.
  #   flf: ABSENT per A5 — cloud ltx-2.3 does not expose a first-last-frame
  #        endpoint.
  #
  # SD-001: ltx-2.3 refers to the Lightricks LTX-2.3 distilled model.
  # =========================================================================
  - id: ltx-2.3
    modality: video
    modes:
      t2v:
        supports:
          - prompt
          - negative_prompt
          - seed
          - resolution
          - frames
          - fps
          - guidance_scale
          - steps
          - shift
          - loras
          - enable_safety_checker
        requires:
          - prompt
        backends:
          local:
            template: video/ltx2_3_t2v
            template_hash: "sha256:572de0f257257305dd5b2e8c099e4076434801c286fa8a4666dee2f9671e3261"
          cloud:
            endpoint: fal-ai/ltx-2.3/text-to-video/fast
      i2v:
        supports:
          - prompt
          - negative_prompt
          - seed
          - image_ref
          - resolution
          - frames
          - fps
          - guidance_scale
          - steps
          - shift
          - loras
          - enable_safety_checker
        requires:
          - prompt
          - image_ref
        backends:
          local:
            template: video/ltx2_3_i2v
            template_hash: "sha256:b093fd5e439a2f862789c50661bc3d4ba4500791be6b954661f12db3ccc9cc31"
          cloud:
            endpoint: fal-ai/ltx-2.3/image-to-video/fast
            # When LoRAs are requested the backend routes to this quality
            # endpoint, which accepts a `loras` list of {path, scale,
            # transformer} items (fal-ai/ltx-2.3-quality/image-to-video/lora).
            # The base /fast endpoint does not take custom LoRAs.
            lora_endpoint: fal-ai/ltx-2.3-quality/image-to-video/lora
      flf:
        supports:
          - prompt
          - negative_prompt
          - seed
          - image_ref
          - image_end_ref
          - resolution
          - frames
          - fps
        requires:
          - prompt
          - image_ref
          - image_end_ref
        backends:
          local:
            template: video/ltx2_3_runexx_first_last_frame
            template_hash: "sha256:7ec63b4662cacbd7105858d4284939af70b29f4c8c6893134c97f5dcaacc41ab"
  # =========================================================================
  # ltx-2.3-pro — LTX-2.3 pro endpoints (cloud-only t2v + i2v)
  # =========================================================================
  - id: ltx-2.3-pro
    modality: video
    modes:
      t2v:
        supports:
          - prompt
          - negative_prompt
          - seed
          - resolution
          - frames
          - fps
          - guidance_scale
          - steps
          - shift
          - loras
          - enable_safety_checker
        requires:
          - prompt
        backends:
          cloud:
            endpoint: fal-ai/ltx-2.3/text-to-video
      i2v:
        supports:
          - prompt
          - negative_prompt
          - seed
          - image_ref
          - resolution
          - frames
          - fps
          - guidance_scale
          - steps
          - shift
          - loras
          - enable_safety_checker
        requires:
          - prompt
          - image_ref
        backends:
          cloud:
            endpoint: fal-ai/ltx-2.3/image-to-video