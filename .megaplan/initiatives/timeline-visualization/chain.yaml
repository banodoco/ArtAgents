base_branch: main

anchors:
  north_star: NORTHSTAR.md

milestones:
  - label: m1-navigation-spine
    idea: .megaplan/initiatives/timeline-visualization/briefs/m1-navigation-spine.md
    profile: partnered-4
    robustness: full
    depth: high
    vendor: codex
    notes: >-
      Establish the complete agent visualization and frozen navigation
      contract from project overview through verified original media.

  - label: m2-source-text-vlm
    idea: .megaplan/initiatives/timeline-visualization/briefs/m2-source-text-vlm.md
    profile: partnered-4
    robustness: full
    depth: high
    vendor: codex
    depends_on:
      - m1-navigation-spine
    notes: >-
      Consume milestone one's written navigation contract, add
      provenance-correct text/transcript mapping, and prove the full journey
      through adversarial VLM and freshness/integrity tests.

on_failure:
  retry: retry_milestone
  abort: stop_chain

merge_policy: auto

driver:
  auto_approve: true
  max_iterations: 60
  robustness: full
  poll_sleep: 8.0
