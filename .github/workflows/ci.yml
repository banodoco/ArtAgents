name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_pack_recoverability_exhaustive:
        description: "Run the opt-in exhaustive pack enum recoverability sweep"
        required: false
        default: false
        type: boolean

jobs:
  m7-admission:
    name: m7 finalizer admission
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run m7 finalizer admission first
        # This is the custody boundary for every m7 lane.  A missing,
        # rejected, stale, or plan-mismatched admission fails closed.
        run: |
          python3 scripts/reshape/m7_gate.py \
            --artifact-dir artifacts/m7 \
            --admission artifacts/m7/finalizer-admission.json

      - name: Upload m7 admission evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m7-finalizer-admission
          path: artifacts/m7/finalizer-admission.json
          if-no-files-found: ignore

  m7-release-candidate:
    name: m7 release-candidate evidence and gates
    needs: m7-admission
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Download admitted custody record
        uses: actions/download-artifact@v4
        with:
          name: m7-finalizer-admission
          path: artifacts/m7

      - name: Revalidate admission before m7 execution
        run: |
          python3 scripts/reshape/m7_gate.py \
            --check \
            --artifact-dir artifacts/m7 \
            --admission artifacts/m7/finalizer-admission.json

      - name: Focused m7 fixture lane
        run: timeout 120 python3 -m pytest tests/v10/test_m7_fixture.py -q

      - name: Focused m7 backup lane
        run: timeout 120 python3 -m pytest tests/v10/test_backup_restore.py -q

      - name: Focused m7 hardening lane
        run: timeout 120 python3 -m pytest tests/v10/test_m7_hardening.py -q

      - name: Focused m7 contention lane
        run: timeout 120 python3 -m pytest tests/v10/test_m7_bridge_contention.py -q

      - name: Focused m7 dogfood lane
        run: timeout 120 python3 -m pytest tests/v10/test_m7_dogfood.py -q

      - name: Focused m7 documentation lane
        run: timeout 120 python3 -m pytest tests/v10/test_m7_docs.py -q

      - name: Focused m7 performance report (report-only)
        # No approved normative budget exists; retain the report without
        # turning performance into a blocking GA claim.
        continue-on-error: true
        run: timeout 120 python3 -m pytest tests/v10/test_m7_performance.py -q

      - name: Existing m3 pack-factoring gate
        run: timeout 120 python3 -m pytest tests/v10/test_pack_factoring.py -q

      - name: Existing m6 gate
        run: timeout 120 python3 -m pytest tests/v10/test_m6_gate.py -q

      - name: Authority lint
        run: python3 scripts/reshape/authority_lint.py

      - name: Pack factoring check
        run: python3 scripts/reshape/check_pack_factoring.py

      - name: All v10 tests
        run: timeout 900 python3 -m pytest tests/v10 -q

      - name: Repository-wide lint
        run: python3 scripts/reshape/compare_ruff_baseline.py

      - name: Repository-wide typecheck
        run: python3 scripts/reshape/compare_mypy_baseline.py

      - name: Repository-wide test gate
        run: timeout 900 python3 -m pytest tests -q

      - name: Set up Node for repository typecheck
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Install pinned Remotion toolchain
        working-directory: remotion
        run: npm ci

      - name: Remotion typecheck
        working-directory: remotion
        run: npm run typecheck

      - name: Revalidate admission immediately before m7 publication
        run: |
          python3 scripts/reshape/m7_gate.py \
            --check \
            --artifact-dir artifacts/m7 \
            --admission artifacts/m7/finalizer-admission.json

      - name: Publish m7 GA evidence atomically
        # m7_gate.py revalidates the same hash immediately before replacing
        # acceptance.json and defects.md. Items 11/12 stay provisional or
        # retained, and item 6 external Reigh proof is not substituted by the
        # in-tree bridge lane.
        run: make m7-gate

      - name: Assert honest non-substitutable m7 dispositions
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          acceptance = json.loads(Path("artifacts/m7/acceptance.json").read_text())
          unresolved = {
              item["id"]: item
              for item in acceptance["unresolved_external_manual_gates"]
          }
          assert unresolved["external-reigh-editor"]["status"] == "unresolved"
          assert unresolved["installed-artifact-items-11-12"]["status"] == "deferred"
          assert unresolved["performance-budget"]["status"] == "unresolved"
          assert acceptance["ga_items"]["11"]["label"] == "provisional"
          assert acceptance["ga_items"]["12"]["label"] == "retained"
          PY

      - name: Upload m7 evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m7-release-candidate-evidence
          path: |
            artifacts/m7/**
            out/m7-gate/**
          if-no-files-found: ignore

  python:
    name: Python quality gates
    needs: m7-release-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Validate editable install
        run: |
          python -c "import astrid; print('Editable install validation passed')"

      - name: Blocking clean wheel-install proof
        run: bash scripts/smoke_wheel_install.sh

      - name: RunPod-extra validation (advisory — skipped without private index)
        continue-on-error: true
        run: bash scripts/smoke_runpod_extra.sh

      - name: Run doctor check
        run: |
          # Blocking: on a CI runner with no .env on disk, the env-template check
          # reports advisory-only, so a clean checkout exits 0.
          python -m astrid doctor --json

      - name: Fresh-clone core smoke (advisory)
        continue-on-error: true
        run: bash scripts/smoke_fresh_clone.sh

      - name: Run Ruff baseline check (blocking)
        run: |
          python scripts/reshape/compare_ruff_baseline.py

      - name: Run mypy baseline check (blocking)
        run: |
          python scripts/reshape/compare_mypy_baseline.py

      - name: Set up Node for blocking Remotion typecheck
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: remotion/package-lock.json

      - name: Install pinned Remotion toolchain
        working-directory: remotion
        run: npm ci

      - name: Run local CI mirror
        env:
          # Coverage is skipped so the broad lane fits the job timeout; the S1
          # gate is skipped here because the dedicated "Run S1 gate" step below
          # runs it (same make target, so local and GitHub CI stay in lockstep).
          ASTRID_CI_SKIP_COVERAGE: "1"
          ASTRID_CI_SKIP_GATE: "1"
        run: bash scripts/reshape/run_ci_checks.sh

      - name: Run S1 gate (blocking, m1 event-core foundation)
        # Twelve focused m1 lanes (manifest, catalog, migration, registry,
        # receipt, replay, crash, contention, conformance, lint, bridge,
        # provider) against a fresh hermetic root. Exits 1 on any lane failure
        # so the job goes red, while the upload step below still retains all
        # evidence (summary + logs) via `if: always()`.
        run: make s1-gate

      - name: Upload S1 gate summary and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s1-gate-evidence
          path: out/s1-gate/latest
          if-no-files-found: ignore

      - name: Remotion typecheck (blocking, explicit)
        working-directory: remotion
        run: npm run typecheck

      - name: Renderer parity (blocking, explicit)
        run: python -m pytest -q -m renderer_parity tests/packs/test_renderer_parity.py

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  m4-gate:
    name: m4 focused gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # The frozen m4 platform matrix: CPython 3.11 and 3.12 (Linux CI,
        # editable installation for the development gate).
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run m4 finalizer gate (blocking)
        # 13 retained focused lanes + live authority lint + forbidden
        # authority/schema/surface drift rejection + Python matrix + the
        # present-accepted feasibility admission (fails closed when the
        # admission is missing or rejected). The external Reigh editor lane
        # is reporting-only (SD1) and runs in the dedicated job below.
        env:
          ASTRID_CI_SKIP_COVERAGE: "1"
        run: make m4-gate

      - name: Upload m4 gate admission and lane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-gate-evidence-${{ matrix.python-version }}
          path: |
            artifacts/m4/finalizer-admission.json
            out/m4-gate/latest
          if-no-files-found: ignore

  m4-editor-reporting:
    name: m4 external editor lane (reporting-only)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # The frozen m4 platform matrix keeps CPython 3.11/3.12 pinned;
          # this reporting lane runs the primary 3.11 target.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # The frozen Node floor (docs/contracts/supported-platforms.md):
          # 20.19 is pinned, never "latest 20.x".
          node-version: "20.19.0"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Install current stable Chromium (editor lane)
        # Executes the frozen "current stable Chromium" browser target
        # (docs/contracts/supported-platforms.md): Playwright installs its
        # current stable Chromium build plus the OS libraries it needs
        # (--with-deps) under the pinned Node 20.19 floor.
        working-directory: scripts/reshape/editor_browser_smoke
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run browser-backed editor selector (current stable Chromium)
        # A real browser-backed selector: Playwright launches the installed
        # current stable Chromium headless and asserts the frozen bridge
        # timeline read model through DOM locators (real JS + real network
        # + real DOM). This step is NOT continue-on-error: the documented
        # target must actually execute, so a browser failure is visible
        # editor-lane evidence, not a silent gap.
        working-directory: scripts/reshape/editor_browser_smoke
        run: npm run smoke

      - name: Fetch pinned Reigh checkout (reporting-only)
        # The external editor repo is observed, never modified (SD1). A
        # fetch failure is retained evidence, not an m4 admission input.
        continue-on-error: true
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/banodoco/reigh-app.git /tmp/reigh-app
          cd /tmp/reigh-app
          git fetch --depth 1 origin bc2d8b0327c1c7dbdcd7b7445440d8ca180dd677
          git checkout FETCH_HEAD

      - name: Run pinned Reigh disposition lane (reporting-only)
        # Always runs and retains schema-validated disposition evidence;
        # external incompatibility is a hard named follow-up, never a
        # success prerequisite for make m4-gate (SD1).
        continue-on-error: true
        run: python scripts/reigh_disposition_report.py --reigh-repo /tmp/reigh-app

      - name: Upload Reigh disposition evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m4-reigh-disposition
          path: artifacts/m4/reigh-external-gate-disposition.json
          if-no-files-found: ignore

  pack-recoverability-exhaustive:
    name: Pack recoverability exhaustive (opt-in)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_pack_recoverability_exhaustive }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run exhaustive pack recoverability sweep
        run: |
          python -m pytest tests/test_pack_enum_recoverability.py -m pack_recoverability_exhaustive -q
