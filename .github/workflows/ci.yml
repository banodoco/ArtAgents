name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validate editable install (advisory)
        continue-on-error: true
        run: |
          python -m pip install -e '.[dev]'
          echo "Editable install validation passed (advisory only)"

      - name: Run doctor check (advisory)
        continue-on-error: true
        run: |
          python -m astrid doctor --json

      - name: Run Ruff baseline check (advisory)
        continue-on-error: true
        run: |
          python scripts/reshape/compare_ruff_baseline.py

      - name: Run mypy baseline check (advisory)
        continue-on-error: true
        run: |
          python scripts/reshape/compare_mypy_baseline.py

      - name: Run local CI mirror
        run: bash scripts/reshape/run_ci_checks.sh
